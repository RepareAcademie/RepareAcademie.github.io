<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Répar'Académie</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;--org:#f97316;--grn:#22c55e;--red:#ef4444;--line:#334155;--hdr:#0b1222;--inp:#0b1222;--soft:#cbd5e1;--planon:#0f2a1b;--warnbg:#3b1d0a;--warnbd:#9a3412;--onacc:#04263a}
[data-theme="light"]{--bg:#f4f6fb;--card:#ffffff;--card2:#eef2f7;--txt:#0f172a;--mut:#5b6478;--acc:#0284c7;--org:#ea580c;--grn:#16a34a;--red:#dc2626;--line:#dbe2ec;--hdr:#ffffff;--inp:#f8fafc;--soft:#334155;--planon:#ecfdf3;--warnbg:#fff4e6;--warnbd:#fdba74;--onacc:#ffffff}
[data-theme="light"] .tag.free{background:#dcfce7;color:#166534}[data-theme="light"] .tag.pro{background:#ffedd5;color:#9a3412}[data-theme="light"] .tag.at{background:#ede9fe;color:#5b21b6}
[data-theme="light"] .b-grn{color:#fff}[data-theme="light"] .badge{color:#fff}
body,header,nav.bottom,.card,.row,.plan,textarea,input{transition:background-color .25s,color .25s,border-color .25s}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--hdr);border-bottom:1px solid var(--line)}
header h1{font-size:18px;letter-spacing:.3px}
header h1 span{color:var(--acc)}
.dots{background:none;border:none;color:var(--txt);font-size:26px;width:42px;height:42px;border-radius:50%;cursor:pointer;line-height:1}
.dots:active{background:var(--card)}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:22px;margin-bottom:6px}
h3{font-size:17px;margin:14px 0 8px}
p{line-height:1.55}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:inline-block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.b-acc{background:var(--acc);color:var(--onacc)}.b-org{background:var(--org);color:#fff}.b-grn{background:var(--grn);color:#04210f}.b-ghost{background:var(--card2);color:var(--txt)}
textarea,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font-size:16px;margin-top:8px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;color:var(--txt);text-decoration:none}
.row:active{background:var(--card2)}
.row .ic{font-size:22px;width:30px;text-align:center}
.row .tx{flex:1}
.row .tx small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.row.locked{opacity:.55}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.tag.free{background:#14532d;color:#86efac}.tag.pro{background:#7c2d12;color:#fdba74}.tag.at{background:#4c1d95;color:#c4b5fd}
.plan{border:2px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;background:var(--card)}
.plan.on{border-color:var(--grn);background:var(--planon)}
.plan .price{font-size:30px;font-weight:800;margin:6px 0}
.plan ul{margin:10px 0 0 18px;line-height:1.7;color:var(--soft)}
.badge{display:inline-block;background:var(--grn);color:#04210f;font-weight:800;padding:4px 10px;border-radius:20px;font-size:13px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hdr);border-top:1px solid var(--line);z-index:10}
nav.bottom a{flex:1;text-align:center;padding:10px 4px;color:var(--mut);text-decoration:none;font-size:12px}
nav.bottom a b{display:block;font-size:20px;margin-bottom:2px}
nav.bottom a.act{color:var(--acc)}
.back{display:inline-block;color:var(--acc);text-decoration:none;margin-bottom:10px;font-size:15px}
.step{display:flex;gap:12px;margin:12px 0}
.step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:800;display:flex;align-items:center;justify-content:center}
.warn{background:var(--warnbg);border:1px solid var(--warnbd);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.schema{background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;text-align:center}
.schema svg{width:100%;max-width:420px;height:auto}
.schema figcaption{color:var(--mut);font-size:13px;margin-top:6px}
.prev{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.lang{display:flex;gap:10px;flex-direction:column}
.lang button{padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:17px;text-align:left;cursor:pointer}
.lang button.on{border-color:var(--acc)}
.result h3{color:var(--acc)}
.result li{margin:6px 0 6px 18px;line-height:1.5}
.card ul,.card ol{margin:6px 0 10px 20px;line-height:1.6}
.card p{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--onacc)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);padding:12px 18px;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}
.hdr-r{display:flex;align-items:center;gap:2px}
.themebtn{font-size:20px}
.login-g{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);color:var(--txt);border:1px solid var(--line)}
.sep{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:18px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.prow{display:flex;gap:8px}
.prow select{width:112px;flex:0 0 112px;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font-size:16px;margin-top:8px}
#lgCode{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700}
.lmsg{min-height:20px;font-size:14px;margin-top:12px;line-height:1.4}
.lmsg.err{color:var(--red)}.lmsg.ok{color:var(--grn)}
.lnk{background:none;border:none;color:var(--acc);font-weight:600;cursor:pointer;padding:8px 0;font-size:14px}
.lnk:disabled{color:var(--mut)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:30px}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script>
/* Thème jour / nuit appliqué avant l'affichage */
(function(){var t=null;try{t=localStorage.getItem("ra_theme_mode")}catch(e){}
if(t!=="light"&&t!=="dark")t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
document.documentElement.setAttribute("data-theme",t);})();
</script>

function bindAnalyze(){
 const ph=document.getElementById("photo"); if(!ph) return;

  const d=document.getElementById("desc"), t=c.textContent;

  if(i>-1){ parts.splice(i,1); c.classList.remove("on"); } else { parts.push(t); c.classList.add("on"); }
  d.value=parts.join(", ");
 });
 ph.onchange=e=>{const f=e.target.files[0]; if(!f) return; hasPhoto=true; const r=new FileReader(); r.onload=x=>{const i=document.getElementById("prev"); i.src=x.target.result; i.style.display="block"}; r.readAsDataURL(f);};
 document.getElementById("goAn").onclick=()=>{

  }

 };

let lgTimer=null;
function bindLogin(){
 const $=id=>document.getElementById(id); if(!$("lgGoogle")) return;
 const msg=(t,c)=>{ const m=$("lgMsg"); if(!m) return; m.textContent=t||""; m.className="lmsg "+(c||""); };
 const busy=(b,on,label)=>{ if(!b||!b.isConnected) return; b.disabled=on; b.innerHTML=on?'<span class="spin"></span>':label; };
 const gl=$("lgGoogle").innerHTML;
 $("lgGoogle").onclick=async()=>{ msg(""); busy($("lgGoogle"),true); try{ await window.RA.google(); }catch(e){ msg(authErr(e),"err"); busy($("lgGoogle"),false,gl); } };
 const number=()=>{ let n=$("lgPhone").value.replace(/\D/g,""), c=$("lgCc").value;
  if(n.startsWith("00")) return "+"+n.slice(2); if(n.startsWith(c.slice(1))&&n.length>9) return "+"+n; if(c==="+33"&&n.startsWith("0")) n=n.slice(1); return c+n; };
 const countdown=()=>{ let k=60; clearInterval(lgTimer); $("lgResend").disabled=true; $("lgResend").textContent=tr("resend")+" ("+k+"s)";
  lgTimer=setInterval(()=>{ const b=$("lgResend"); if(!b){clearInterval(lgTimer);return;} k--; if(k<=0){clearInterval(lgTimer); b.disabled=false; b.textContent=tr("resend");} else b.textContent=tr("resend")+" ("+k+"s)"; },1000); };
 const sl=$("lgSend").innerHTML;
 const send=async()=>{ msg(""); const n=number(); if(n.replace(/\D/g,"").length<8){ msg(tr("badPhone"),"err"); return; }
  busy($("lgSend"),true);
  try{ await window.RA.sendCode(n); if(!$("lgStep1")) return; $("lgStep1").style.display="none"; $("lgStep2").style.display="block"; $("lgTo").textContent=tr("sentTo")+n; $("lgCode").value=""; $("lgCode").focus(); msg(tr("codeSent"),"ok"); countdown(); }
  catch(e){ window.RA.resetCaptcha(); msg(authErr(e),"err"); }
  busy($("lgSend"),false,sl); };
 $("lgSend").onclick=send; $("lgPhone").onkeydown=e=>{ if(e.key==="Enter") send(); };
 const vl=$("lgVerify").innerHTML;
 const verify=async()=>{ const c=$("lgCode").value.replace(/\D/g,""); if(c.length!==6){ msg(tr("badCodeLen"),"err"); return; }
  busy($("lgVerify"),true); try{ await window.RA.verify(c); msg(tr("loggedIn"),"ok"); }catch(e){ msg(authErr(e),"err"); busy($("lgVerify"),false,vl); } };
 $("lgVerify").onclick=verify; $("lgCode").oninput=()=>{ if($("lgCode").value.replace(/\D/g,"").length===6) verify(); };
 $("lgResend").onclick=()=>{ window.RA.resetCaptcha(); $("lgStep2").style.display="none"; $("lgStep1").style.display="block"; send(); };
 $("lgChange").onclick=()=>{ clearInterval(lgTimer); window.RA.resetCaptcha(); $("lgStep2").style.display="none"; $("lgStep1").style.display="block"; msg(""); };
}

/* ---------- Leçons pour Pro / Atelier ---------- */
function lockedPage(){ return `<div class="card" style="text-align:center"><div style="font-size:48px">🔒</div><p>${hadSub()?tr("expired"):tr("locked")}</p><a class="btn b-org" href="#/abonnement">${tr("goPro")}</a></div>`; }
function listLevel(level){ return LESSONS.filter(l=>l.level===level).map(l=>`<a class="row" href="#/lecon/${l.id}"><span class="ic">${l.icon}</span><span class="tx">${pick(l.t)}</span>${lessonLevelLabel(level)}</a>`).join(""); }
function vPro(){ return `<a class="back" href="#/abonnement">${tr("back")}</a><h2>⭐ ${tr("proTitle")}</h2>${canOpen("pro")?listLevel("pro")+(canOpen("atelier")?`<a class="row" href="#/atelier" style="border-color:#a78bfa"><span class="ic">🔧</span><span class="tx">${tr("atTitle")}</span>›</a>`:""):lockedPage()}`; }
function vAtelier(){ return `<a class="back" href="#/abonnement">${tr("back")}</a><h2>🔧 ${tr("atTitle")}</h2>${canOpen("atelier")?listLevel("atelier"):lockedPage()}`; }

/* ---------- Menu gauche : PARAMÈTRES ---------- */
function vSettings(){
 const r=(href,ic,label,sm)=>`<a class="row" href="#/${href}"><span class="ic">${ic}</span><span class="tx">${label}${sm?`<small>${sm}</small>`:""}</span>›</a>`;
 const u=user();
 return `<h2>⚙️ ${tr("settings")}</h2>
 ${u?r("compte","👤",tr("myAccount"),esc(u.displayName||u.phoneNumber||u.email||"")):r("connexion","👤",tr("login"),tr("loginSmall"))}
 <a class="row" href="javascript:void(0)" onclick="toggleTheme()"><span class="ic">${themeNow()==="light"?"☀️":"🌙"}</span><span class="tx">${tr("theme")}<small>${themeNow()==="light"?tr("dayMode"):tr("nightMode")} · ${tr("themeSub")}</small></span><span class="tag">${themeNow()==="light"?tr("nightMode"):tr("dayMode")}</span></a>
 ${r("historique","🕘",tr("history"),tr("historySub"))}
 ${r("langue","🌍",tr("language"),{fr:"Français",bm:"Bamanankan",en:"English"}[lang])}
 ${r("abonnement","⭐",tr("account"),sub()?(sub().admin?"👑 "+tr("admin"):tr("subscribed")+" – "+tr("until")+fmtDate(sub().until)):"")}
 <h3>📄</h3>
 ${r("politique/confidentialite","🔒",tr("privacy"))}
 ${r("politique/cookies","🍪",tr("cookies"))}
 ${r("politique/conditions","📜",tr("terms"))}
 ${r("politique/remboursement","💳",tr("refund"))}
 ${r("politique/mentions","⚖️",tr("legal"))}`;
}

/* ---------- Historique ---------- */
function vHistory(){
 const hl=S.get("hl",[]), hd=S.get("hd",[]);
 const lessonRow=h=>{const L=LESSONS.find(x=>x.id===h.id); if(!L) return ""; const ok=canOpen(L.level);
  return `<a class="row ${ok?"":"locked"}" href="#/lecon/${L.id}"><span class="ic">${ok?L.icon:"🔒"}</span><span class="tx">${pick(L.t)}<small>${fmtDate(h.t)}${ok?"":" · "+tr("expired")}</small></span>${lessonLevelLabel(L.level)}</a>`;};
 const diagRow=h=>{const L=LESSONS.find(x=>x.id===h.lesson); const ok=L?canOpen(L.level):true;
  return `<a class="row ${ok?"":"locked"}" href="#/lecon/${h.lesson}"><span class="ic">${ok?"🔍":"🔒"}</span><span class="tx">${h.q}<small>${fmtDate(h.t)}</small></span></a>`;};
 setTimeout(()=>{const b=document.getElementById("clr"); if(b) b.onclick=()=>{S.set("hl",[]);S.set("hd",[]);render();}},0);
 return `<a class="back" href="#/parametres">${tr("back")}</a><h2>🕘 ${tr("history")}</h2>
 <h3>${tr("lastLessons")}</h3>${hl.length?hl.map(lessonRow).join(""):`<p class="mut">${tr("empty")}</p>`}
 <h3>${tr("lastDiag")}</h3>${hd.length?hd.map(diagRow).join(""):`<p class="mut">${tr("empty")}</p>`}
 ${(hl.length||hd.length)?`<button class="btn b-ghost" id="clr">${tr("clear")}</button>`:""}`;
}

/* ---------- Langue ---------- */
function vLang(){
 setTimeout(()=>document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;S.set("lang",lang);render();}),0);
 const b=(c,n)=>`<button data-l="${c}" class="${lang===c?"on":""}">${n}${lang===c?" ✓":""}</button>`;
 return `<a class="back" href="#/parametres">${tr("back")}</a><h2>🌍 ${tr("chooseLang")}</h2>
 <div class="lang">${b("fr","🇫🇷 Français")}${b("bm","🇲🇱 Bamanankan")}${b("en","🇬🇧 English")}</div>
 ${lang==="bm"?`<p class="mut" style="margin-top:12px">${tr("langNote")}</p>`:""}`;
}

<h3>5. Droit de rétractation</h3>
<p>Conformément à l'article 72 de la loi malienne n° 2016-012 du 6 mai 2016, le consommateur bénéficie, lorsque les dispositions applicables le prévoient, d'un délai de quatorze (14) jours calendaires pour exercer son droit de rétractation dans le cadre d'un contrat conclu à distance.</p>
<p>Ce droit peut toutefois connaître certaines exceptions prévues par la législation.</p>
<p><b>Cas particulier des contenus numériques :</b></p>
<p>Conformément à l'article 75, point 12, de la loi n° 2016-012, le droit de rétractation peut être exclu pour la fourniture d'un contenu numérique non fourni sur support matériel lorsque les conditions légales suivantes sont réunies :</p>
<ul><li>Le consommateur a donné son accord préalable et exprès pour que l'exécution commence avant l'expiration du délai de rétractation.</li><li>Le consommateur a reconnu expressément qu'il perdrait son droit de rétractation dans les conditions prévues par la loi.</li></ul>

<h3>6. Conditions de remboursement</h3>
<p>Les achats de contenus numériques peuvent devenir définitifs lorsque les conditions légales d'exclusion du droit de rétractation sont effectivement réunies.</p>
<p>Toutefois, cette règle ne prive pas le consommateur de ses autres droits légaux.</p>
<p>Une demande de remboursement peut notamment être examinée dans les situations suivantes :</p>
<p><b>6.1. Paiement effectué sans activation de l'abonnement</b></p>
<p>Lorsqu'un paiement est confirmé mais que l'abonnement n'est pas activé en raison d'une erreur imputable à Répar'Académie, l'utilisateur peut demander la régularisation de son accès ou le remboursement des sommes versées lorsque celui-ci est dû.</p>
<p><b>6.2. Double paiement</b></p>
<p>Lorsqu'un utilisateur effectue accidentellement deux paiements pour une même commande ou un même abonnement, le paiement excédentaire pourra être remboursé après vérification des transactions.</p>
<p><b>6.3. Erreur de montant</b></p>
<p>En cas de paiement d'un montant incorrect résultant d'une erreur imputable à Répar'Académie ou à son système de paiement, une vérification sera effectuée et une régularisation appropriée sera proposée.</p>
<p><b>6.4. Service non fourni</b></p>
<p>Si Répar'Académie ne fournit pas le service payé dans le délai légal ou contractuel applicable, hors cas de force majeure, le consommateur conserve les recours prévus par la législation.</p>
<p>Conformément à l'article 69 de la loi n° 2016-012, les conditions légales de résolution du contrat et de remboursement des sommes versées peuvent notamment s'appliquer en cas de non-exécution de la prestation.</p>
<p><b>6.5. Service inaccessible ou défectueux</b></p>

<p><b>6.6. Paiement non autorisé ou transaction contestée</b></p>

<h3>7. Cas dans lesquels un remboursement peut être refusé</h3>
<p>Sous réserve des droits impératifs reconnus au consommateur par la législation applicable, un remboursement peut notamment être refusé lorsque :</p>

<p>Pour demander un remboursement, l'utilisateur doit contacter le service d'assistance officiel de Répar'Académie.</p>

<h3>9. Durée et renouvellement des abonnements</h3>

const RA = window.RA = { ready:false, user:null, configured: !!(firebaseConfig && firebaseConfig.apiKey && !/COLLE/.test(firebaseConfig.apiKey)) };
if(!RA.configured){ RA.ready=true; window.render && render(); }
else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  auth.languageCode = (window.lang==="en") ? "en" : "fr";
  setPersistence(auth, browserLocalPersistence).catch(()=>{});
  let verifier=null, confirmation=null;
  RA.resetCaptcha = () => { try{ verifier && verifier.clear(); }catch(e){} verifier=null; const c=document.getElementById("recaptcha-container"); if(c) c.innerHTML=""; };
  RA.google = async () => {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:"select_account" });
    try { await signInWithPopup(auth, p); }
    catch(e){
      if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) { await signInWithRedirect(auth, p); return; }
      throw e;
    }
  };
  RA.sendCode = async (number) => {
    if(!verifier) verifier = new RecaptchaVerifier(auth, "recaptcha-container", { size:"invisible" });
    confirmation = await signInWithPhoneNumber(auth, number, verifier);
  };
  RA.verify = async (code) => { if(!confirmation) throw { code:"auth/code-expired" }; await confirmation.confirm(code); };
  RA.logout = () => signOut(auth);
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth, (u) => {
    RA.user = u; RA.ready = true;
    if(u){
      /* Ancien abonnement enregistré sur cet appareil : on le rattache au compte */
      try{ const old=localStorage.getItem("ra_sub"); if(old && !localStorage.getItem("ra_sub_"+u.uid)){ localStorage.setItem("ra_sub_"+u.uid, old); localStorage.removeItem("ra_sub"); } }catch(e){}
      if((location.hash||"").indexOf("#/connexion")===0){
        let to="abonnement"; try{ to=sessionStorage.getItem("ra_after_login")||"abonnement"; sessionStorage.removeItem("ra_after_login"); }catch(e){}
        location.hash="#/"+to; return;
      }
    }
    window.render && render();
  });
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1222">
<title>Atelier Mobile – Répar Academy</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;--org:#f97316;--grn:#22c55e;--red:#ef4444;--line:#334155;--hdr:#0b1222;--inp:#0b1222;--soft:#cbd5e1;--planon:#0f2a1b;--warnbg:#3b1d0a;--warnbd:#9a3412;--onacc:#04263a}
[data-theme="light"]{--bg:#f4f6fb;--card:#ffffff;--card2:#eef2f7;--txt:#0f172a;--mut:#5b6478;--acc:#0284c7;--org:#ea580c;--grn:#16a34a;--red:#dc2626;--line:#dbe2ec;--hdr:#ffffff;--inp:#f8fafc;--soft:#334155;--planon:#ecfdf3;--warnbg:#fff4e6;--warnbd:#fdba74;--onacc:#ffffff}
[data-theme="light"] .tag.free{background:#dcfce7;color:#166534}[data-theme="light"] .tag.pro{background:#ffedd5;color:#9a3412}[data-theme="light"] .tag.at{background:#ede9fe;color:#5b21b6}
[data-theme="light"] .b-grn{color:#fff}[data-theme="light"] .badge{color:#fff}
body,header,nav.bottom,.card,.row,.plan,textarea,input{transition:background-color .25s,color .25s,border-color .25s}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--hdr);border-bottom:1px solid var(--line)}
header h1{font-size:18px;letter-spacing:.3px}
header h1 span{color:var(--acc)}
.dots{background:none;border:none;color:var(--txt);font-size:26px;width:42px;height:42px;border-radius:50%;cursor:pointer;line-height:1}
.dots:active{background:var(--card)}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:22px;margin-bottom:6px}
h3{font-size:17px;margin:14px 0 8px}
p{line-height:1.55}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:inline-block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.b-acc{background:var(--acc);color:var(--onacc)}.b-org{background:var(--org);color:#fff}.b-grn{background:var(--grn);color:#04210f}.b-ghost{background:var(--card2);color:var(--txt)}
textarea,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font-size:16px;margin-top:8px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;color:var(--txt);text-decoration:none}
.row:active{background:var(--card2)}
.row .ic{font-size:22px;width:30px;text-align:center}
.row .tx{flex:1}
.row .tx small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.row.locked{opacity:.55}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.tag.free{background:#14532d;color:#86efac}.tag.pro{background:#7c2d12;color:#fdba74}.tag.at{background:#4c1d95;color:#c4b5fd}
.plan{border:2px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;background:var(--card)}
.plan.on{border-color:var(--grn);background:var(--planon)}
.plan .price{font-size:30px;font-weight:800;margin:6px 0}
.plan ul{margin:10px 0 0 18px;line-height:1.7;color:var(--soft)}
.badge{display:inline-block;background:var(--grn);color:#04210f;font-weight:800;padding:4px 10px;border-radius:20px;font-size:13px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hdr);border-top:1px solid var(--line);z-index:10}
nav.bottom a{flex:1;text-align:center;padding:10px 4px;color:var(--mut);text-decoration:none;font-size:12px}
nav.bottom a b{display:block;font-size:20px;margin-bottom:2px}
nav.bottom a.act{color:var(--acc)}
.back{display:inline-block;color:var(--acc);text-decoration:none;margin-bottom:10px;font-size:15px}
.step{display:flex;gap:12px;margin:12px 0}
.step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:800;display:flex;align-items:center;justify-content:center}
.warn{background:var(--warnbg);border:1px solid var(--warnbd);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.schema{background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;text-align:center}
.schema svg{width:100%;max-width:420px;height:auto}
.schema figcaption{color:var(--mut);font-size:13px;margin-top:6px}
.prev{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.lang{display:flex;gap:10px;flex-direction:column}
.lang button{padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:17px;text-align:left;cursor:pointer}
.lang button.on{border-color:var(--acc)}
.result h3{color:var(--acc)}
.result li{margin:6px 0 6px 18px;line-height:1.5}
.card ul,.card ol{margin:6px 0 10px 20px;line-height:1.6}
.card p{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--onacc)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);padding:12px 18px;border-radius:12px;display:none;z-index:40;max-width:90%;text-align:center}
.hdr-r{display:flex;align-items:center;gap:2px}
.themebtn{font-size:20px}
.login-g{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);color:var(--txt);border:1px solid var(--line)}
.sep{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:18px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.prow{display:flex;gap:8px}
.prow select{width:112px;flex:0 0 112px;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font-size:16px;margin-top:8px}
#lgCode{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700}
.lmsg{min-height:20px;font-size:14px;margin-top:12px;line-height:1.4}
.lmsg.err{color:var(--red)}.lmsg.ok{color:var(--grn)}
.lnk{background:none;border:none;color:var(--acc);font-weight:600;cursor:pointer;padding:8px 0;font-size:14px}
.lnk:disabled{color:var(--mut)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:30px}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== Fenêtres superposées (paramètres, options, abonnement…) ===== */
:root{--navh:64px}
#scrim{position:fixed;top:0;left:0;right:0;bottom:var(--navh);background:rgba(2,6,23,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
#panel{position:fixed;top:0;left:0;width:84%;max-width:440px;bottom:calc(var(--navh) + 52px);background:var(--bg);color:var(--txt);z-index:21;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:0 0 22px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:8px 8px 30px rgba(0,0,0,.45);transform:translateX(-104%);transition:transform .28s ease;visibility:hidden}
body.pan{overflow:hidden}
body.pan #scrim{opacity:1;pointer-events:auto}
body.pan #panel{transform:none;visibility:visible}
#panelBody{padding:14px 16px 28px}
.pclose{position:sticky;top:0;float:right;margin:10px 10px 0 0;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:18px;cursor:pointer}

/* ================= NOUVEAU DESIGN (concept « Atelier Mobile ») ================= */
:root{--navh:64px;--g1:#0b1630;--g2:#10224a}
body{padding-bottom:calc(var(--navh) + 12px);background:var(--bg)}
body.nonav{--navh:0px;padding-bottom:0}
body.nonav nav.bottom{display:none}
header{display:none}
main{max-width:640px;padding:0 0 12px}
.pg{padding:0 16px 16px}
.tb{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:8px;padding:12px 12px;background:var(--hdr);border-bottom:1px solid var(--line)}
.tb h1{flex:1;font-size:17px;text-align:center;font-weight:800;line-height:1.2}
.tb .tbr{min-width:40px;display:flex;justify-content:flex-end;gap:2px}
.ib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--txt);text-decoration:none;background:none;border:none;cursor:pointer}
.ib:active{background:var(--card)}
nav.bottom a b{font-size:21px}
.hello{padding:18px 16px 4px}.hello h2{font-size:24px;margin:0}.hello p{color:var(--mut)}
.search{display:flex;align-items:center;gap:10px;margin:12px 16px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--mut);text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 16px 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--txt);font-size:11.5px;text-align:center}
.tile i{font-style:normal;width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.banner{position:relative;display:block;margin:14px 16px;border-radius:18px;overflow:hidden;min-height:120px;text-decoration:none;color:#fff;border:1px solid var(--line)}
.banner .art{position:absolute;inset:0}.banner .art svg{width:100%;height:100%}
.banner .tx{position:relative;padding:18px;background:linear-gradient(90deg,rgba(8,16,40,.92) 35%,rgba(8,16,40,.15))}
.banner b{display:block;font-size:20px;line-height:1.15}.banner small{display:block;margin-top:8px;color:#7dd3fc;font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 16px 8px}.sec h3{margin:0;font-size:17px}.sec a{color:var(--acc);font-size:13px;text-decoration:none}
.th{flex:0 0 74px;height:62px;border-radius:11px;overflow:hidden;background:var(--g1);border:1px solid var(--line)}
.th svg,.th img{width:100%;height:100%;object-fit:cover;display:block}
.li{display:flex;align-items:center;gap:12px;padding:10px;margin:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);text-decoration:none}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-size:14.5px;line-height:1.25}.li .tx small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.play{flex:0 0 38px;height:38px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.play.lock{background:var(--card2);color:var(--mut)}.play.done{background:var(--grn);color:#04210f}
.pbar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.seg{display:flex;gap:6px;margin:12px 16px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.seg a,.seg button{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--mut);text-decoration:none;background:none;border:none;cursor:pointer}
.seg .on{background:var(--acc);color:var(--onacc)}
.hero{position:relative;height:210px;overflow:hidden;background:var(--g1)}.hero svg,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .sh{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(transparent,rgba(5,10,25,.85));color:#fff;font-weight:800;font-size:17px}
.hero .dl{position:absolute;right:10px;top:10px;background:rgba(5,10,25,.6);color:#fff}
.box{margin:12px 16px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.box h4{margin:0 0 8px;font-size:15px;color:var(--acc)}.box p{font-size:14.5px}
.box ul{margin:6px 0 0 18px;line-height:1.6;font-size:14.5px}
.mat{display:flex;gap:8px;flex-wrap:wrap}.mat span{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:84px;padding:10px 6px;border-radius:12px;background:var(--card2);font-size:11.5px;text-align:center}.mat span i{font-style:normal;font-size:26px}
.stk{position:sticky;bottom:0;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 35%)}
.good,.bad{margin:12px 16px;border-radius:14px;overflow:hidden;border:2px solid}
.good{border-color:#16a34a}.bad{border-color:#dc2626}
.good h4,.bad h4{margin:0;padding:10px 14px;color:#fff;font-size:15px}.good h4{background:#16a34a}.bad h4{background:#dc2626}
.good ul,.bad ul{list-style:none;margin:0;padding:10px 14px;display:grid;gap:8px;font-size:14px}.good li::before{content:"✔ ";color:#16a34a;font-weight:800}.bad li::before{content:"✖ ";color:#dc2626;font-weight:800}
.sch{margin:12px 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b1222}.sch svg{width:100%;display:block}
.st{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:14px}.st b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-size:13px}
.qopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin:9px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;text-align:left;cursor:pointer}
.qopt i{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--mut)}
.qopt.ok{border-color:#16a34a;background:#14532d;color:#fff}.qopt.ok i{background:#fff;border-color:#fff}
.qopt.ko{border-color:#dc2626;background:#7f1d1d;color:#fff}
.ring{width:132px;height:132px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.ring b{font-size:30px}.ring small{color:var(--mut);font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 16px}
.kpi{padding:12px 6px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px}.kpi b{display:block;font-size:22px}.kpi small{color:var(--mut);font-size:11.5px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}
.pl{border-radius:14px;padding:12px;color:#fff;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.pl b{font-size:15px}.pl .pr{font-size:19px;font-weight:800}.pl ul{margin:6px 0 0 14px;line-height:1.5}
.pl.g0{background:#14532d}.pl.g1{background:#1e3a8a}.pl.g2{background:#581c87}.pl.g3{background:#92400e}
.pl.cur{outline:3px solid #fff}
.pm{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:700}
.pm.on{border-color:var(--acc)}.pm i{width:34px;height:34px;border-radius:9px;font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.av{width:78px;height:78px;border-radius:50%;margin:16px auto 6px;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;border:3px solid var(--acc)}
.av img{width:100%;height:100%;object-fit:cover}
.cert{margin:12px 16px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#fff7dd,#f5e6b3);color:#3b2f0b;border:2px solid #c9a227;text-align:center}
.cert.lk{filter:grayscale(1);opacity:.55}
.mrow{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:10px;color:var(--txt);text-decoration:none;font-size:15px}
.mrow.on{background:var(--acc);color:var(--onacc);font-weight:700}.mrow:active{background:var(--card2)}
.mrow i{font-style:normal;width:24px;text-align:center}
.rad{display:flex;align-items:center;gap:10px;padding:12px 4px;font-size:15px;cursor:pointer}.rad i{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut)}.rad.on i{border-color:var(--acc);background:radial-gradient(var(--acc) 45%,transparent 50%)}
.faq summary{padding:12px 4px;font-weight:700;cursor:pointer}.faq p{padding:0 4px 12px;color:var(--soft);font-size:14px}
/* écran de démarrage et bienvenue */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#16306b,#070d1f);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
#splash h1{font-size:34px;margin:10px 0 0}#splash h1 span{display:block;font-size:20px;font-weight:600;color:#cbd5e1;margin-top:2px}
.sp-bar{width:220px;height:8px;border-radius:8px;background:#1e293b;margin-top:34px;overflow:hidden}.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8)}
.wel{min-height:100vh;display:flex;flex-direction:column;background:#070d1f;color:#fff}
.wel .art{height:46vh;position:relative}.wel .art svg{width:100%;height:100%}
.wel .art::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#070d1f)}
.wel .bd{padding:0 22px 26px;margin-top:-24px;position:relative;text-align:center}
.wel h2{font-size:26px;line-height:1.15;margin:10px 0 6px}.wel p{color:#94a3b8;margin-bottom:12px}
.wel .btn{margin-top:10px}.wel .out{background:none;border:2px solid #334155;color:#fff}
/* administrateur */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px}
.adm .li .tx small{white-space:normal}
.fld{display:block;margin:10px 16px 0;font-size:13px;color:var(--mut)}.fld input,.fld select,.fld textarea{margin-top:4px}
.pillb{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;background:var(--card2);color:var(--mut);margin-left:6px}
.pillb.g{background:#14532d;color:#86efac}.pillb.o{background:#7c2d12;color:#fdba74}.pillb.r{background:#7f1d1d;color:#fca5a5}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini button{flex:1;min-width:110px;padding:9px;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;background:var(--card2);color:var(--txt)}
.mini .g{background:var(--grn);color:#04210f}.mini .r{background:#7f1d1d;color:#fff}
#panel .tb{position:sticky;top:0}
.pclose{display:none}
.plans .pl:last-child{grid-column:1/-1}
a.pm,a.rad{color:var(--txt);text-decoration:none}
select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font-size:16px;margin-top:4px;font-family:inherit}

.chk{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-size:13.5px;line-height:1.45}.chk input{width:22px;height:22px;margin:2px 0 0;flex:0 0 22px}
</style>
<script>
/* Thème appliqué avant l'affichage *//* Thème jour / nuit appliqué avant l'affichage */
(function(){var t=null;try{t=localStorage.getItem("ra_theme_mode")}catch(e){}
if(t!=="light"&&t!=="dark")t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
document.documentElement.setAttribute("data-theme",t);})();
</script>

function bindAnalyze(){

 document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  const d=document.getElementById("desc"), t=c.textContent;

  const i=parts.indexOf(t);
  if(i>-1){ parts.splice(i,1); c.classList.remove("on"); } else { parts.push(t); c.classList.add("on"); }
  d.value=parts.join(", ");
 });
 ph.onchange=e=>{const f=e.target.files[0]; if(!f) return; hasPhoto=true; const r=new FileReader(); r.onload=x=>{const i=document.getElementById("prev"); i.src=x.target.result; i.style.display="block"}; r.readAsDataURL(f);};
 document.getElementById("goAn").onclick=()=>{

  }

  const rule=RULES.map(r=>({r,score:r.k.filter(k=>low.includes(k)).length})).sort((a,b)=>b.score-a.score)[0];
  let html;
  if(!rule||rule.score===0){ html=`<div class="card">${tr("unknown")}</div>`; }
  else{
   const r=rule.r, L=LESSONS.find(x=>x.id===r.lesson);
   if(!s){ S.set(usedKey(),used+1); const dl=document.getElementById("diagLeft"); if(dl) dl.textContent=tr("freeLeft")+Math.max(0,FREE_DIAGNOSTICS-used-1)+" / "+FREE_DIAGNOSTICS; }
   pushHist("hd",{t:Date.now(),q:(model?model+" – ":"")+d.slice(0,80),lesson:r.lesson,level:L.level});
   html=`<div class="card result">
    ${hasPhoto?`<p class="mut">${tr("photoNote")}</p>`:""}

   </div>`;
  }
  document.getElementById("res").innerHTML=html;
  const p=document.querySelector("main p.mut:last-of-type");
 };
}

let lgTimer=null;
function bindLogin(){
 const $=id=>document.getElementById(id); if(!$("lgGoogle")) return;
 const msg=(t,c)=>{ const m=$("lgMsg"); if(!m) return; m.textContent=t||""; m.className="lmsg "+(c||""); };
 const busy=(b,on,label)=>{ if(!b||!b.isConnected) return; b.disabled=on; b.innerHTML=on?'<span class="spin"></span>':label; };
 const okc=()=>{ const c=$("lgConsent"); if(c&&!c.checked){ msg(tr("needAccept"),"err"); return false; } try{ localStorage.setItem("ra_consent",String(Date.now())); }catch(e){} return true; };
 const gl=$("lgGoogle").innerHTML;
 $("lgGoogle").onclick=async()=>{ msg(""); if(!okc()) return; busy($("lgGoogle"),true); try{ await window.RA.google(); }catch(e){ msg(authErr(e),"err"); busy($("lgGoogle"),false,gl); } };
 const number=()=>{ let n=$("lgPhone").value.replace(/\D/g,""), c=$("lgCc").value;
  if(n.startsWith("00")) return "+"+n.slice(2); if(n.startsWith(c.slice(1))&&n.length>9) return "+"+n; if(c==="+33"&&n.startsWith("0")) n=n.slice(1); return c+n; };
 const countdown=()=>{ let k=60; clearInterval(lgTimer); $("lgResend").disabled=true; $("lgResend").textContent=tr("resend")+" ("+k+"s)";
  lgTimer=setInterval(()=>{ const b=$("lgResend"); if(!b){clearInterval(lgTimer);return;} k--; if(k<=0){clearInterval(lgTimer); b.disabled=false; b.textContent=tr("resend");} else b.textContent=tr("resend")+" ("+k+"s)"; },1000); };
 const sl=$("lgSend").innerHTML;
 const send=async()=>{ msg(""); if(!okc()) return; const n=number(); if(n.replace(/\D/g,"").length<8){ msg(tr("badPhone"),"err"); return; }
  busy($("lgSend"),true);
  try{ await window.RA.sendCode(n); if(!$("lgStep1")) return; $("lgStep1").style.display="none"; $("lgStep2").style.display="block"; $("lgTo").textContent=tr("sentTo")+n; $("lgCode").value=""; $("lgCode").focus(); msg(tr("codeSent"),"ok"); countdown(); }
  catch(e){ window.RA.resetCaptcha(); msg(authErr(e),"err"); }
  busy($("lgSend"),false,sl); };
 $("lgSend").onclick=send; $("lgPhone").onkeydown=e=>{ if(e.key==="Enter") send(); };
 const vl=$("lgVerify").innerHTML;
 const verify=async()=>{ const c=$("lgCode").value.replace(/\D/g,""); if(c.length!==6){ msg(tr("badCodeLen"),"err"); return; }
  busy($("lgVerify"),true); try{ await window.RA.verify(c); msg(tr("loggedIn"),"ok"); }catch(e){ msg(authErr(e),"err"); busy($("lgVerify"),false,vl); } };
 $("lgVerify").onclick=verify; $("lgCode").oninput=()=>{ if($("lgCode").value.replace(/\D/g,"").length===6) verify(); };
 $("lgResend").onclick=()=>{ window.RA.resetCaptcha(); $("lgStep2").style.display="none"; $("lgStep1").style.display="block"; send(); };
 $("lgChange").onclick=()=>{ clearInterval(lgTimer); window.RA.resetCaptcha(); $("lgStep2").style.display="none"; $("lgStep1").style.display="block"; msg(""); };
}

(type T12 ou JBC) est préférable à un fer simple","Température habituelle : 300 à 350 °C","Une panne étamée (brillante) transmet bien la chaleur"],"e":["Allumer et régler la température","Nettoyer la panne dans la laine de laiton","Étamer la pointe avec un peu d'étain","Poser la panne pour chauffer pastille et patte en même temps","Reposer le fer sur son support et réétamer avant de l'éteindre"],"x":["Monter à 450 °C « pour aller vite »","Laisser la panne sèche et noire","Appuyer fort sur la carte"],"q":[{"question":"Pourquoi étamer la panne ?","choix":["Pour la refroidir","Pour bien transmettre la chaleur et la protéger","Pour la rendre magnétique"],"reponse":1}],"d":25,"s":"Les trois formes de pannes (conique, biseautée, couteau) avec un exemple d'usage sous chacune."},{"id":"microsoudure-08","n":8,"t":"Découvrir la station à air chaud","c":"Outils, matériaux et sécurité","o":2,"v":"Débutant","a":"pro","i":"La station à air chaud chauffe une zone avec un souffle d'air réglable. Elle sert à retirer les CMS, les circuits intégrés et les connecteurs.","r":["Deux réglages : température (souvent 300 à 380 °C) et débit d'air","Les buses changent la largeur du jet","La distance de la buse change fortement la chaleur reçue","Toujours chauffer en mouvement circulaire"],"e":["Choisir la buse adaptée","Régler la température et le débit","Préchauffer la zone de loin","Rapprocher la buse en mouvements circulaires","Soulever le composant dès que l'étain est liquide"],"x":["Débit trop fort qui fait voler les petits composants","Chauffer un point fixe","Oublier que la chaleur atteint aussi les composants voisins"],"q":[{"question":"Pourquoi chauffer en mouvement circulaire ?","choix":["Pour souffler la poussière","Pour refroidir la buse","Pour répartir la chaleur"],"reponse":2}],"d":25,"s":"Buse au-dessus d'une puce, cône d'air chaud dessiné, distance de 1 à 2 cm indiquée et mouvement circulaire fléché."},{"id":"microsoudure-09","n":9,"t":"Utiliser le microscope","c":"Outils, matériaux et sécurité","o":2,"v":"Débutant","a":"pro","i":"À l'œil nu, on ne voit ni un pont d'étain ni une piste fissurée. Le microscope stéréo est indispensable en micro-soudure.","r":["Microscope stéréo à deux oculaires, grossissement de 7x à 45x","Distance de travail d'au moins 10 cm pour passer les outils","Éclairage LED en anneau","Les microscopes numériques sur écran sont moins pratiques pour souder"],"e":["Régler l'écart entre les yeux","Faire la mise au point au plus faible grossissement","Centrer la zone de travail","Augmenter le grossissement pour inspecter","Revenir à un grossissement faible pour souder"],"x":["Souder au grossissement maximal (champ trop petit)","Mauvais éclairage qui cache les défauts","Carte posée sans support stable"],"q":[{"question":"Quel grossissement pour souder confortablement ?","choix":["Faible à moyen","Toujours le maximum","Aucun"],"reponse":0}],"d":25,"s":"Microscope stéréo légendé : oculaires, molette de zoom, mise au point, éclairage en anneau, distance de travail."},{"id":"microsoudure-10","n":10,"t":"Flux, étain et alliages","c":"Outils, matériaux et sécurité","o":2,"v":"Débutant","a":"pro","i":"Le flux et l'étain sont les consommables qui font la qualité d'une soudure. Un mauvais flux donne de mauvais résultats, même avec un excellent fer.","r":["Étain avec plomb (Sn63/Pb37) : fond à 183 °C, plus facile à travailler","Étain sans plomb (SAC305) : fond vers 217 à 220 °C","Fil fin de 0,3 à 0,5 mm pour la micro-soudure","Flux en gel « no-clean » pour la plupart des travaux","Pâte basse température (environ 138 °C) pour protéger une puce sensible"],"e":["Choisir l'étain selon la carte","Appliquer une petite quantité de flux","Souder","Nettoyer les résidus à l'alcool isopropylique (IPA) à 99 %","Refermer les flacons après usage"],"x":["Mettre trop de flux","Utiliser un décapant de plomberie","Laisser des résidus sur la carte"],"q":[{"question":"Avec quoi nettoie-t-on les résidus de flux ?","choix":["L'eau du robinet","L'alcool isopropylique","L'huile"],"reponse":1}],"d":25,"s":"Tableau visuel : alliage, température de fusion, usage conseillé, avec une bobine d'étain et une seringue de flux dessinées."},{"id":"microsoudure-11","n":11,"t":"Tresse, pompe et outils","c":"Outils, matériaux et sécurité","o":2,"v":"Débutant","a":"pro","i":"Retirer l'excès d'étain et manipuler les composants demande quelques outils simples mais précis.","r":["Tresse à dessouder : cuivre tressé qui absorbe l'étain","Pompe à dessouder : utile pour les trous traversants","Pinces brucelles fines et courbes, antistatiques","Spatule, pinceau, scalpel et ruban Kapton"],"e":["Ajouter du flux sur la tresse","Poser la tresse sur l'étain","Chauffer à travers la tresse","Retirer la tresse et le fer ensemble","Couper la partie usée de la tresse"],"x":["Frotter la tresse (cela arrache les pastilles)","Laisser la tresse refroidir collée à la carte","Pinces magnétiques qui attirent les composants"],"q":[{"question":"Comment retirer la tresse ?","choix":["Après refroidissement","En la frottant","En même temps que le fer, sans tirer à froid"],"reponse":2}],"d":25,"s":"Tresse posée sur des pastilles, panne au-dessus, flèche montrant l'étain qui remonte dans la tresse."},{"id":"microsoudure-12","n":12,"t":"Sécurité ESD et batteries lithium-ion","c":"Outils, matériaux et sécurité","o":2,"v":"Débutant","a":"pro","i":"L'électricité statique peut détruire un composant sans qu'on le voie, et les batteries lithium peuvent prendre feu. Ces deux risques se gèrent avec des règles simples.","r":["ESD : décharge électrostatique de plusieurs milliers de volts","Porter un bracelet antistatique relié à la terre","Débrancher la batterie avant toute soudure","Batterie gonflée, percée ou chauffée = risque d'incendie","Garder un bac de sable ou un extincteur à portée de main"],"e":["Mettre le bracelet antistatique","Ouvrir le téléphone et débrancher la batterie en premier","Éloigner la batterie de la zone de chauffe","Travailler dans un endroit aéré","Stocker les batteries abîmées dans un contenant ininflammable"],"x":["Chauffer près d'une batterie","Percer une batterie avec un outil métallique","Souder avec la batterie branchée"],"q":[{"question":"Que faire en premier après avoir ouvert un téléphone ?","choix":["Débrancher la batterie","Chauffer la carte","Nettoyer l'écran"],"reponse":0}],"d":25,"s":"Deux illustrations : bracelet antistatique relié à la terre ; batterie débranchée et isolée avec le symbole de danger feu."},{"id":"microsoudure-13","n":13,"t":"Tension, courant et résistance","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"Trois grandeurs expliquent presque toutes les pannes : la tension, le courant et la résistance. Les comprendre, c'est comprendre ce que mesure le multimètre.","r":["Tension (volts, V) : la « pression » électrique","Courant (ampères, A) : la quantité qui circule","Résistance (ohms, Ω) : ce qui freine le courant","Une batterie de téléphone donne environ 3,7 à 4,4 V"],"e":["Repérer la source de tension (batterie, chargeur)","Suivre le chemin du courant","Identifier ce qui consomme","Comparer avec une carte saine","Mesurer pour confirmer"],"x":["Confondre tension et courant","Penser qu'une tension présente veut dire que tout fonctionne","Mesurer sans connaître l'unité"],"q":[{"question":"En quelle unité se mesure le courant ?","choix":["Le volt","L'ampère","L'ohm"],"reponse":1}],"d":25,"s":"Analogie du château d'eau : hauteur de l'eau = tension, débit = courant, tuyau étroit = résistance."},{"id":"microsoudure-14","n":14,"t":"Loi d'Ohm et puissance","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"La loi d'Ohm relie la tension, le courant et la résistance. Elle permet de comprendre une consommation anormale ou un composant qui chauffe.","r":["U = R × I (tension = résistance × courant)","I = U / R et R = U / I","Puissance : P = U × I, en watts","Exemple : 5 V et 2 A donnent 10 W"],"e":["Noter les deux valeurs connues","Choisir la bonne formule","Calculer","Comparer au comportement réel","Conclure : consommation normale ou court-circuit"],"x":["Mélanger les unités (mA et A)","Oublier de convertir les kΩ","Croire qu'une résistance très faible est toujours bonne"],"q":[{"question":"Avec 5 V et 2 A, quelle est la puissance ?","choix":["7 W","2,5 W","10 W"],"reponse":2}],"d":25,"s":"Triangle U au-dessus de R × I, avec un exemple chiffré à côté."},{"id":"microsoudure-15","n":15,"t":"Courant continu et polarité","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"Un téléphone fonctionne en courant continu (DC). Le sens du courant compte : on parle de polarité, et une erreur peut détruire la carte.","r":["Le plus (+) et le moins (-, appelé masse ou GND)","Le chargeur transforme le courant alternatif du secteur en courant continu","Une inversion de polarité peut griller un composant","La masse est commune à toute la carte"],"e":["Repérer le + et le - de la batterie","Placer la pointe noire du multimètre à la masse","Mesurer sur la ligne voulue","Respecter la polarité en alimentant la carte","Vérifier deux fois avant de brancher"],"x":["Inverser les fils d'une alimentation","Confondre masse et ligne positive","Brancher une batterie à l'envers"],"q":[{"question":"Comment appelle-t-on le moins sur une carte ?","choix":["La masse (GND)","La phase","Le neutre"],"reponse":0}],"d":25,"s":"Connecteur de batterie avec les bornes +, - et NTC repérées, et pointes du multimètre bien placées."},{"id":"microsoudure-16","n":16,"t":"Résistances","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"La résistance limite le courant ou crée une tension précise. Une carte de téléphone en contient des centaines.","r":["Valeur en ohms, marquée par un code (103 = 10 kΩ) ou sans marquage","Une résistance de 0 Ω sert de pont","Une résistance coupée bloque une fonction","La mesure n'est exacte que hors circuit : sur carte, on compare"],"e":["Identifier la résistance (R)","La mesurer en mode ohms","Comparer à la valeur attendue sur le schéma","La remplacer si elle est ouverte ou brûlée","Revérifier après remplacement"],"x":["Croire que la mesure sur carte est toujours exacte","Remplacer par une valeur au hasard","Chauffer trop et décoller les pastilles"],"q":[{"question":"Que vaut le code 103 ?","choix":["103 Ω","10 kΩ","1 kΩ"],"reponse":1}],"d":25,"s":"Résistance CMS agrandie avec le code 103 et le calcul 10 × 10³ = 10 000 Ω."},{"id":"microsoudure-17","n":17,"t":"Condensateurs","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"Le condensateur stocke un peu d'énergie et filtre les tensions. C'est le composant le plus nombreux et une cause très fréquente de court-circuit.","r":["Valeur en farads (souvent µF ou nF)","Il est souvent placé entre une ligne et la masse","En court-circuit, il met la ligne à la masse","Les condensateurs CMS n'ont aucun marquage"],"e":["Repérer la ligne en court-circuit","Repérer les condensateurs sur cette ligne","Chercher celui qui chauffe","Le retirer et remesurer la ligne","Le remplacer par un identique"],"x":["Retirer tous les condensateurs au hasard","Prendre une tension de service trop faible","Oublier de remesurer après le retrait"],"q":[{"question":"Où est souvent relié un condensateur ?","choix":["Entre deux écrans","Au processeur uniquement","Entre une ligne et la masse"],"reponse":2}],"d":25,"s":"Ligne d'alimentation avec plusieurs condensateurs reliés à la masse, l'un d'eux en rouge « en court-circuit »."},{"id":"microsoudure-18","n":18,"t":"Diodes et LED","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"La diode laisse passer le courant dans un seul sens. Elle protège la carte contre les surtensions et les erreurs de branchement.","r":["Anode et cathode : le trait indique la cathode","Diode TVS : protège contre les surtensions, souvent près du connecteur de charge","LED : diode qui émet de la lumière (rétroéclairage, flash)","Le mode diode du multimètre permet de la tester"],"e":["Repérer la diode et son sens","Mesurer en mode diode dans les deux sens","Valeur dans un sens et rien dans l'autre = bonne diode","Valeur proche de 0 dans les deux sens = diode en court","Remplacer en respectant le sens"],"x":["Souder la diode à l'envers","Confondre diode et résistance","Retirer une diode de protection sans la remplacer"],"q":[{"question":"Une diode en bon état laisse passer le courant…","choix":["Dans un seul sens","Dans les deux sens","Jamais"],"reponse":0}],"d":25,"s":"Symbole de diode, composant CMS avec son trait, flèche du sens du courant et deux mesures (passante et bloquée)."},{"id":"microsoudure-19","n":19,"t":"Bobines et fusibles","c":"Bases d'électricité et d'électronique","o":3,"v":"Débutant","a":"pro","i":"La bobine stocke l'énergie dans un champ magnétique, surtout dans les circuits d'alimentation. Le fusible coupe le circuit quand le courant devient trop fort.","r":["Bobine (L) : résistance presque nulle","Une bobine ouverte coupe toute une alimentation","Fusible (F) : doit montrer une continuité","Un fusible coupé signale un problème plus loin dans le circuit"],"e":["Mesurer la continuité de la bobine","Mesurer la continuité du fusible","Si le fusible est coupé, chercher la cause avant de le remplacer","Remplacer par la même valeur","Tester la consommation après"],"x":["Remplacer un fusible par un fil","Ignorer la cause d'un fusible grillé","Fissurer une bobine en serrant trop la pince"],"q":[{"question":"Un fusible grillé indique…","choix":["Que tout va bien","Un problème à chercher plus loin dans le circuit","Une batterie neuve"],"reponse":1}],"d":25,"s":"Alimentation simplifiée : PMIC → bobine → condensateur → sortie ; fusible près du connecteur de charge."},{"id":"microsoudure-20","n":20,"t":"Préparer et entretenir la panne","c":"Premiers gestes de soudure","o":4,"v":"Débutant","a":"pro","i":"Une panne propre et étamée fait la moitié du travail. Une panne oxydée refuse l'étain et chauffe mal.","r":["Nettoyer dans la laine de laiton plutôt qu'avec une éponge trop mouillée","Étamer avant chaque usage et avant d'éteindre","Un réactivateur de panne restaure une pointe noircie","Ne jamais limer une panne"],"e":["Chauffer à la température de travail","Nettoyer dans la laine de laiton","Déposer un peu d'étain neuf","Essuyer l'excès","Réétamer avant de poser le fer sur son support"],"x":["Laisser le fer chauffer à vide pendant des heures","Gratter la panne au cutter","Éteindre le fer avec une panne sèche"],"q":[{"question":"Que faire avant d'éteindre le fer ?","choix":["La refroidir à l'eau","La limer","Réétamer la panne"],"reponse":2}],"d":25,"s":"Avant / après : panne noire et oxydée, puis panne brillante et étamée."},{"id":"microsoudure-21","n":21,"t":"Soudure traversante","c":"Premiers gestes de soudure","o":4,"v":"Débutant","a":"pro","i":"Les composants traversants passent à travers la carte. On les trouve sur les anciens téléphones, les accessoires et les cartes d'entraînement : c'est idéal pour apprendre le geste.","r":["Chauffer à la fois la pastille et la patte","Apporter l'étain sur le joint, pas sur la panne","Le bon joint ressemble à un petit volcan brillant","Temps de chauffe : 2 à 3 secondes"],"e":["Insérer le composant et plier légèrement les pattes","Poser la panne contre la patte et la pastille","Apporter l'étain","Retirer l'étain, puis le fer","Couper la patte au-dessus du joint"],"x":["Joint en boule (pas assez chauffé)","Trop d'étain","Bouger la patte pendant le refroidissement"],"q":[{"question":"Où apporte-t-on l'étain ?","choix":["Sur le joint chauffé","Sur la panne seulement","Sous la carte froide"],"reponse":0}],"d":25,"s":"Coupe d'un joint traversant réussi (forme conique) et de trois ratés : boule, joint froid, excès d'étain."},{"id":"microsoudure-22","n":22,"t":"Soudure CMS","c":"Premiers gestes de soudure","o":4,"v":"Débutant","a":"pro","i":"Souder un CMS demande de la précision : on fixe d'abord un côté, puis l'autre.","r":["Pré-étamer une seule pastille","Placer le composant à la pince","Souder le premier côté, puis le second","Le flux aide l'étain à bien se répartir"],"e":["Mettre un peu de flux","Déposer un point d'étain sur une pastille","Positionner le composant et chauffer ce point","Souder l'autre côté","Reprendre le premier côté si besoin et contrôler"],"x":["Composant qui se dresse (effet « pierre tombale »)","Trop d'étain qui crée un pont","Composant décalé"],"q":[{"question":"Comment appelle-t-on un composant qui se redresse ?","choix":["Effet pont","Effet pierre tombale","Effet boule"],"reponse":1}],"d":25,"s":"Trois étapes pour une résistance 0402 : pré-étamage, pose, soudure du second côté ; à côté, l'effet pierre tombale."},{"id":"microsoudure-23","n":23,"t":"Dessouder un composant traversant","c":"Premiers gestes de soudure","o":4,"v":"Débutant","a":"pro","i":"Retirer un composant traversant sans abîmer les trous demande de vider l'étain proprement.","r":["Pompe à dessouder ou tresse","Ajouter de l'étain frais aide l'ancien à fondre","Chauffer et aspirer au bon moment","Ne jamais forcer une patte encore soudée"],"e":["Ajouter du flux et un peu d'étain","Chauffer le joint","Aspirer à la pompe","Répéter pour chaque patte","Retirer le composant et nettoyer les trous"],"x":["Tirer sur le composant à froid","Surchauffer et décoller la pastille","Laisser de l'étain dans le trou"],"q":[{"question":"Pourquoi ajouter de l'étain frais ?","choix":["Pour solidifier","Pour isoler","Pour mieux faire fondre l'ancien"],"reponse":2}],"d":25,"s":"Pompe à dessouder posée sur un joint chauffé, avec la flèche d'aspiration."},{"id":"microsoudure-24","n":24,"t":"Dessouder un composant CMS","c":"Premiers gestes de soudure","o":4,"v":"Débutant","a":"pro","i":"Pour retirer un petit CMS, il faut chauffer ses deux côtés en même temps, à l'air chaud ou avec le fer.","r":["Air chaud : petite buse et débit faible","Astuce au fer : déposer une grosse goutte d'étain qui recouvre les deux côtés","Le flux protège et aide la fusion","Soulever dès que l'étain est liquide"],"e":["Appliquer du flux","Chauffer à l'air chaud en cercle, ou couvrir d'étain avec le fer","Soulever doucement à la pince","Nettoyer les pastilles à la tresse","Inspecter les pastilles"],"x":["Pousser le composant sur le côté","Souffler les composants voisins","Arracher une pastille"],"q":[{"question":"Quand soulève-t-on le composant ?","choix":["Quand l'étain est liquide des deux côtés","Dès le début","Après refroidissement"],"reponse":0}],"d":25,"s":"Résistance CMS recouverte d'une goutte d'étain chauffée par la panne ; à côté, air chaud avec une petite buse."},{"id":"microsoudure-25","n":25,"t":"Nettoyer et inspecter une soudure","c":"Premiers gestes de soudure","o":4,"v":"Débutant","a":"pro","i":"Une soudure n'est pas terminée tant qu'elle n'est pas nettoyée et contrôlée au microscope.","r":["Un bon joint est lisse, bien étalé et brillant (étain au plomb)","L'étain sans plomb est un peu plus mat : c'est normal","Rechercher ponts, billes d'étain et joints froids","Nettoyer à l'IPA avec une brosse douce"],"e":["Laisser refroidir","Nettoyer les résidus de flux à l'IPA","Inspecter chaque joint au microscope","Vérifier l'absence de pont et de bille","Mesurer la continuité si nécessaire"],"x":["Laisser des billes d'étain sous un blindage","Brosser trop fort et déplacer un composant","Valider sans contrôle au microscope"],"q":[{"question":"Qu'est-ce qu'une bille d'étain ?","choix":["Un bon joint","Une petite boule libre qui peut créer un court-circuit","Un composant"],"reponse":1}],"d":25,"s":"Grille d'inspection : joint bon, joint froid, pont, bille d'étain, excès, manque d'étain."},{"id":"microsoudure-26","n":26,"t":"Choisir une panne et une température","c":"Maîtrise des équipements","o":5,"v":"Intermédiaire","a":"atelier","i":"La bonne panne et la bonne température dépendent de la taille de la zone à chauffer, pas de l'envie d'aller vite.","r":["Petite pastille : pointe fine, 300 à 330 °C","Grande surface ou masse : panne large, 350 à 380 °C","Une pointe trop fine sur une masse ne chauffe pas assez","Augmenter la taille de la panne avant d'augmenter la température"],"e":["Évaluer la zone (petit CMS ou masse)","Choisir la panne","Régler la température","Faire un essai court","Ajuster si l'étain fond mal"],"x":["Tout faire à 400 °C","Garder la pointe fine pour tout","Chauffer longtemps faute de bonne panne"],"q":[{"question":"L'étain fond mal sur une masse : que faire d'abord ?","choix":["Monter à 450 °C","Appuyer plus fort","Prendre une panne plus large"],"reponse":2}],"d":25,"s":"Tableau visuel : type de travail → panne → température conseillée."},{"id":"microsoudure-27","n":27,"t":"Régler le débit d'air chaud","c":"Maîtrise des équipements","o":5,"v":"Intermédiaire","a":"atelier","i":"Le débit d'air compte autant que la température. Mal réglé, il souffle les composants ou chauffe mal.","r":["Débit faible pour les petits CMS","Débit moyen pour les circuits intégrés et les connecteurs","Plus la buse est proche, plus la chaleur est forte","Tester ses réglages sur une vieille carte avant une réparation client"],"e":["Choisir la buse","Commencer avec un débit faible","Chauffer à 2 ou 3 cm, puis rapprocher","Observer si les composants voisins bougent","Ajuster le débit"],"x":["Débit maximal sur un 0201","Buse trop large qui chauffe toute la carte","Ne jamais tester ses réglages"],"q":[{"question":"Pour un petit CMS, quel débit ?","choix":["Faible","Maximal","Aucun"],"reponse":0}],"d":25,"s":"Trois buses avec trois débits, flèches d'air plus ou moins fortes, et composants qui restent en place ou s'envolent."},{"id":"microsoudure-28","n":28,"t":"Préparer une carte avant intervention","c":"Maîtrise des équipements","o":5,"v":"Intermédiaire","a":"atelier","i":"Une carte bien préparée évite les accidents : pièces fondues, nappes brûlées, composants perdus.","r":["Retirer batterie, nappes, caméras et pièces en plastique","Fixer la carte sur un support","Nettoyer la zone de travail","Photographier avant toute modification"],"e":["Débrancher la batterie","Retirer les pièces amovibles proches","Fixer la carte sur le support","Photographier la zone","Nettoyer à l'IPA"],"x":["Laisser une caméra à côté de la zone chauffée","Carte qui bouge pendant la soudure","Ne rien photographier"],"q":[{"question":"Pourquoi photographier avant ?","choix":["Pour la publicité","Pour savoir remettre chaque composant","Pour chauffer moins"],"reponse":1}],"d":25,"s":"Carte sur son support de fixation, éléments retirés listés à côté, appareil photo pour la photo « avant »."},{"id":"microsoudure-29","n":29,"t":"Protéger les composants thermosensibles","c":"Maîtrise des équipements","o":5,"v":"Intermédiaire","a":"atelier","i":"Certains éléments supportent mal la chaleur : connecteurs en plastique, caméras, micros et puces voisines.","r":["Ruban Kapton pour masquer","Papier aluminium plié en bouclier","Pâte de protection thermique","Préchauffeur sous la carte pour réduire le temps de chauffe"],"e":["Repérer les composants sensibles proches","Les recouvrir de Kapton ou d'aluminium","Préchauffer si possible","Travailler vite et en cercle","Retirer les protections et contrôler"],"x":["Faire fondre le plastique d'un connecteur","Aluminium qui touche des contacts sous tension","Oublier de retirer la protection"],"q":[{"question":"À quoi sert le ruban Kapton ?","choix":["Coller l'écran","Conduire le courant","Protéger de la chaleur"],"reponse":2}],"d":25,"s":"Zone chauffée entourée d'un bouclier en aluminium, avec du Kapton sur un connecteur voisin."},{"id":"microsoudure-30","n":30,"t":"Contrôler la qualité d'un joint","c":"Maîtrise des équipements","o":5,"v":"Intermédiaire","a":"atelier","i":"Contrôler, c'est vérifier le joint à l'œil et à la mesure. Un joint qui « tient » n'est pas forcément bon.","r":["Forme : ménisque creusé, sans boule","Aspect : lisse et régulier","Mesure : continuité entre la patte et la piste","Test léger à la pince, sans forcer"],"e":["Inspecter au microscope sous plusieurs angles","Mesurer la continuité","Vérifier l'absence de court-circuit à la masse","Tester la fonction","Noter le résultat"],"x":["Valider à l'œil seulement","Forcer avec la pince et casser le joint","Oublier les joints voisins"],"q":[{"question":"Un bon joint a une forme…","choix":["Creusée en ménisque","En boule","Plate et terne"],"reponse":0}],"d":25,"s":"Joint vu de côté : bon (creusé), insuffisant, excès ; multimètre en mode continuité."},{"id":"microsoudure-31","n":31,"t":"Remplacer une résistance CMS","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Une résistance coupée peut bloquer l'allumage, la charge ou l'éclairage. Son remplacement est un exercice de base.","r":["Trouver la valeur sur le schéma","Prendre la même taille et la même valeur","Une résistance récupérée sur un téléphone donneur fait l'affaire","Contrôler la valeur avant de souder"],"e":["Mesurer et confirmer la panne","Retirer l'ancienne résistance","Nettoyer les pastilles","Souder la nouvelle","Mesurer et tester"],"x":["Remplacer par une valeur au hasard","Confondre avec un condensateur","Arracher les pastilles"],"q":[{"question":"Où trouver la bonne valeur ?","choix":["Au hasard","Sur le schéma de la carte","Sur la batterie"],"reponse":1}],"d":25,"s":"Avant / après sur une résistance 0402, avec la valeur affichée sur le multimètre."},{"id":"microsoudure-32","n":32,"t":"Remplacer un condensateur CMS","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Un condensateur en court-circuit met une ligne d'alimentation à la masse. Le remplacer règle souvent un téléphone qui ne s'allume plus.","r":["Même capacité et tension de service égale ou supérieure","Le retirer permet de vérifier s'il est la cause","Ne pas laisser sa place vide sans savoir à quoi il sert","Remesurer la ligne après le retrait"],"e":["Localiser le condensateur fautif","Le retirer","Mesurer : le court-circuit a-t-il disparu ?","Souder un condensateur identique","Tester l'allumage"],"x":["Tension de service trop faible","Laisser définitivement la place vide","Remplacer le mauvais condensateur"],"q":[{"question":"Après le retrait du condensateur, que vérifie-t-on ?","choix":["La couleur de l'écran","La batterie","Si le court-circuit a disparu"],"reponse":2}],"d":25,"s":"Ligne VBAT en court-circuit, condensateur chaud repéré en rouge, mesure avant et après."},{"id":"microsoudure-33","n":33,"t":"Remplacer une diode ou LED","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Les diodes de protection et les LED de rétroéclairage ou de flash se remplacent avec la même méthode, en respectant le sens.","r":["Repérer la cathode avant de retirer","Photographier l'orientation","Une LED s'allume faiblement en mode diode","Une diode de protection en court met la ligne à la masse"],"e":["Noter le sens","Retirer la diode","Tester la nouvelle en mode diode","La souder dans le bon sens","Tester la fonction"],"x":["Inverser le sens","Trop chauffer une LED","Oublier de noter l'orientation"],"q":[{"question":"Que faut-il noter avant de retirer une diode ?","choix":["Son sens","Sa couleur seulement","Sa date"],"reponse":0}],"d":25,"s":"Diode avec le repère de cathode sur la carte et sur le composant, flèches d'alignement."},{"id":"microsoudure-34","n":34,"t":"Remplacer une bobine ou un fusible","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Une bobine ouverte ou un fusible grillé coupe toute une alimentation. Ces composants sont plus gros et demandent plus de chaleur.","r":["Composants massifs : chauffer un peu plus longtemps","Fusible : trouver pourquoi il a grillé","Bobine : même valeur et même taille","Mesurer la continuité après remplacement"],"e":["Confirmer la coupure à la mesure","Rechercher la cause (court-circuit plus loin)","Retirer le composant","Souder le nouveau","Tester la consommation"],"x":["Remplacer le fusible sans chercher la cause","Fissurer la bobine avec la pince","Trop chauffer les composants voisins"],"q":[{"question":"Que faire avant de remplacer un fusible grillé ?","choix":["Rien","Chercher la cause","Changer l'écran"],"reponse":1}],"d":25,"s":"Chemin : connecteur de charge → fusible → bobine → circuit de charge, avec le point de coupure marqué."},{"id":"microsoudure-35","n":35,"t":"Remplacer un connecteur FPC","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Le connecteur FPC reçoit les nappes (écran, batterie, caméra). Une broche abîmée donne un écran noir ou des lignes.","r":["Corps en plastique fragile : protéger et chauffer vite","Beaucoup de broches très fines","Bien aligner avant de souder","Air chaud avec flux, ou fer fin pour les retouches"],"e":["Protéger les composants autour","Chauffer et retirer l'ancien connecteur","Nettoyer et égaliser les pastilles","Aligner le nouveau connecteur et souder","Contrôler chaque broche au microscope"],"x":["Plastique fondu","Ponts entre broches","Connecteur décalé d'une broche"],"q":[{"question":"Quel est le risque principal en chauffant un FPC ?","choix":["Casser l'écran","Vider la batterie","Faire fondre le plastique"],"reponse":2}],"d":25,"s":"Connecteur FPC vu de dessus, alignement des broches sur les pastilles, zone de protection autour."},{"id":"microsoudure-36","n":36,"t":"Remplacer un connecteur de charge","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Le connecteur de charge (USB-C, micro-USB, Lightning) est très sollicité. Quand il est soudé à la carte, son remplacement se fait en micro-soudure.","r":["Pattes de fixation massives : beaucoup de chaleur nécessaire","Ajouter de l'étain basse température facilite le retrait","Protéger les composants proches","Vérifier ensuite la charge et le transfert de données"],"e":["Ajouter du flux et de l'étain basse température","Chauffer à l'air chaud et retirer","Nettoyer les pastilles","Souder le nouveau connecteur bien aligné","Tester la charge et les données"],"x":["Arracher les pastilles des pattes de fixation","Ponts entre les broches de données","Connecteur mal aligné qui gêne le câble"],"q":[{"question":"Pourquoi ajouter de l'étain basse température ?","choix":["Pour faire fondre plus facilement l'ancien","Pour isoler","Pour décorer"],"reponse":0}],"d":25,"s":"Connecteur USB-C en coupe : broches de signal, pattes de fixation et pastilles."},{"id":"microsoudure-37","n":37,"t":"Contrôler un microphone","c":"Remplacement de composants","o":6,"v":"Intermédiaire","a":"atelier","i":"Sur les téléphones récents, le micro est soudé sur la carte. Avant de le remplacer, il faut vérifier qu'il est vraiment en panne.","r":["Tester en appel, en haut-parleur et en mémo vocal","Nettoyer l'orifice du micro","Vérifier l'alimentation du micro","Le micro craint la chaleur et l'eau"],"e":["Tester le micro dans plusieurs applications","Nettoyer l'orifice","Mesurer l'alimentation et la masse","Remplacer si nécessaire avec un préchauffage doux","Retester"],"x":["Boucher l'orifice avec du flux","Chauffer trop longtemps","Confondre panne de micro et panne logicielle"],"q":[{"question":"Que tester en premier ?","choix":["Le changer directement","Le micro dans plusieurs applications","La batterie"],"reponse":1}],"d":25,"s":"Micro en coupe avec son orifice, ses pastilles et la liste des tests à faire."},{"id":"microsoudure-38","n":38,"t":"Préparer les surfaces et les plages","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Une piste ou une pastille ne se répare que sur une surface propre et sans oxyde.","r":["Retirer le vernis vert isolant avec un scalpel ou un stylo en fibre de verre","Nettoyer à l'IPA","Étamer le cuivre mis à nu","Travailler au microscope"],"e":["Repérer la zone","Gratter délicatement le vernis","Nettoyer","Appliquer du flux et étamer","Contrôler la surface"],"x":["Gratter trop profond jusqu'à la couche suivante","Laisser de l'oxyde","Étamer avec trop d'étain"],"q":[{"question":"Qu'enlève-t-on avant d'étamer une piste ?","choix":["Le cuivre","La masse","Le vernis isolant"],"reponse":2}],"d":25,"s":"Piste en coupe : vernis, cuivre, support ; flèche de grattage."},{"id":"microsoudure-39","n":39,"t":"Réaliser une reprise de soudure","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Une reprise consiste à refaire fondre une soudure fissurée ou froide pour qu'elle reprenne correctement.","r":["Toujours ajouter du flux avant de chauffer","Ajouter un peu d'étain frais si nécessaire","Fréquent après une chute ou un choc","Une reprise ne remplace pas toujours un vrai remplacement"],"e":["Identifier le joint suspect","Ajouter du flux","Chauffer jusqu'à la fusion","Laisser refroidir sans bouger","Contrôler et tester"],"x":["Chauffer sans flux","Chauffer toute la carte au lieu du joint","Croire qu'une reprise règle tout"],"q":[{"question":"Qu'ajoute-t-on avant une reprise ?","choix":["Du flux","De l'eau","De la colle"],"reponse":0}],"d":25,"s":"Joint fissuré avant, joint refait après."},{"id":"microsoudure-40","n":40,"t":"Supprimer un pont d'étain","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Un pont d'étain relie deux points qui ne devraient pas l'être et crée un court-circuit.","r":["Avec du flux, l'étain se sépare souvent tout seul","Tirer l'étain avec la panne vers l'extérieur","Tresse pour enlever l'excès","Contrôler au microscope"],"e":["Ajouter du flux","Passer la panne propre entre les points","Si besoin, absorber l'excès avec la tresse","Nettoyer","Vérifier qu'il n'y a plus de continuité entre les deux points"],"x":["Ajouter encore de l'étain","Gratter au scalpel et abîmer les pistes","Oublier les ponts cachés sous le composant"],"q":[{"question":"Qu'est-ce qu'un pont d'étain ?","choix":["Une piste réparée","Un court-circuit entre deux points","Un fusible"],"reponse":1}],"d":25,"s":"Deux broches reliées par un pont, flux ajouté, panne qui tire l'étain, résultat séparé."},{"id":"microsoudure-41","n":41,"t":"Réparer une pastille endommagée","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Une pastille arrachée arrive souvent après un retrait forcé. On peut la reconstruire avec un fil fin et de la colle UV.","r":["Retrouver la piste qui partait de la pastille","Gratter le vernis pour mettre le cuivre à nu","Utiliser un fil très fin (0,02 à 0,1 mm)","Fixer et isoler avec une colle UV"],"e":["Localiser la piste d'origine","Gratter et étamer la piste","Souder un fil fin jusqu'à l'emplacement de la pastille","Fixer à la colle UV","Souder le composant"],"x":["Fil trop épais","Colle UV sur la zone à souder","Oublier de vérifier la continuité"],"q":[{"question":"Avec quoi fixe-t-on le fil de réparation ?","choix":["Du scotch","Du flux","Une colle UV"],"reponse":2}],"d":25,"s":"Pastille arrachée, piste grattée, fil reliant la piste au composant, colle UV autour."},{"id":"microsoudure-42","n":42,"t":"Réparer une piste coupée","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Une piste peut être coupée par une chute, une rayure ou la corrosion. On la relie avec un fil fin.","r":["Trouver les deux extrémités saines","Confirmer la coupure au multimètre","Utiliser un fil émaillé fin","Isoler la réparation"],"e":["Repérer la coupure au microscope","Gratter le vernis de chaque côté","Étamer les deux extrémités","Souder un fil entre les deux","Isoler à la colle UV et mesurer"],"x":["Fil qui touche une autre piste","Fil trop long","Ne pas remesurer"],"q":[{"question":"Comment confirmer une coupure ?","choix":["Au multimètre, en continuité","À l'œil seulement","En chauffant"],"reponse":0}],"d":25,"s":"Piste coupée, deux extrémités grattées, fil soudé en pont, colle UV."},{"id":"microsoudure-43","n":43,"t":"Réaliser un jumper","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Un jumper (pont de fil) relie deux points éloignés quand la piste d'origine est détruite ou cachée dans une couche interne.","r":["Trouver deux points sur la même ligne grâce au schéma","Choisir le chemin le plus court","Fil émaillé isolé","Fixer le fil le long de la carte"],"e":["Identifier la ligne coupée sur le schéma","Choisir les deux points de soudure","Préparer un fil à la bonne longueur","Souder les deux extrémités","Fixer et isoler à la colle UV"],"x":["Relier deux lignes différentes","Fil qui empêche le blindage ou la coque de fermer","Fil qui passe sur une zone chaude"],"q":[{"question":"Quand utilise-t-on un jumper ?","choix":["Pour décorer","Quand la piste d'origine est détruite ou inaccessible","Pour charger plus vite"],"reponse":1}],"d":25,"s":"Carte avec deux points de test reliés par un fil jaune suivant un chemin fléché sans obstacle."},{"id":"microsoudure-44","n":44,"t":"Inspecter une réparation","c":"Réparation des pistes","o":7,"v":"Intermédiaire","a":"atelier","i":"Une réparation de piste doit être solide, isolée et vérifiée avant de remonter le téléphone.","r":["Continuité entre les deux extrémités","Aucun court-circuit avec les pistes voisines ni la masse","Fil bien fixé","Test de la fonction réparée"],"e":["Inspecter au microscope","Mesurer la continuité","Vérifier l'isolement vers la masse","Tester la fonction (charge, écran…)","Remonter et retester"],"x":["Remonter sans mesurer","Colle UV mal durcie","Fil qui se décolle à la fermeture"],"q":[{"question":"Que vérifie-t-on vers la masse ?","choix":["La température","La luminosité","L'absence de court-circuit"],"reponse":2}],"d":25,"s":"Liste de contrôle illustrée : continuité, isolement, fixation, fonction, avec des coches."},{"id":"microsoudure-45","n":45,"t":"Prendre en main le multimètre","c":"Diagnostic électronique","o":8,"v":"Intermédiaire","a":"atelier","i":"Le multimètre est l'outil de diagnostic principal. Bien l'utiliser évite de remplacer des pièces au hasard.","r":["Modes utiles : tension continue (V⎓), résistance (Ω), continuité (bip), mode diode","Cordon noir sur COM, rouge sur V/Ω","Pointes fines ou aiguilles pour les CMS","Vérifier la pile du multimètre"],"e":["Brancher les cordons correctement","Choisir le mode","Toucher les deux pointes ensemble (0 Ω ou bip)","Poser la pointe noire à la masse","Lire et noter la mesure"],"x":["Mesurer une tension en mode ohms","Pointes trop grosses qui créent des courts-circuits","Ne pas noter les valeurs"],"q":[{"question":"Où se branche le cordon noir ?","choix":["Sur COM","Sur 10A","Sur V/Ω"],"reponse":0}],"d":25,"s":"Multimètre légendé : sélecteur, bornes COM et V/Ω, écran, symboles des modes."},{"id":"microsoudure-46","n":46,"t":"Mesurer la continuité","c":"Diagnostic électronique","o":8,"v":"Intermédiaire","a":"atelier","i":"La continuité vérifie que le courant peut passer entre deux points : piste, fusible, nappe.","r":["Le multimètre bipe quand la résistance est très faible","Toujours carte hors tension","Utile pour pistes, fusibles, bobines et nappes","Pas de bip = coupure"],"e":["Débrancher la batterie","Choisir le mode continuité","Toucher les deux extrémités","Écouter le bip","Conclure et noter"],"x":["Mesurer avec la batterie branchée","Confondre un bip vers la masse avec une bonne liaison","Pointes qui glissent"],"q":[{"question":"Pour mesurer la continuité, la carte doit être…","choix":["Sous tension","Hors tension","En charge"],"reponse":1}],"d":25,"s":"Piste avec les deux pointes du multimètre et un bip, puis une piste coupée sans bip."},{"id":"microsoudure-47","n":47,"t":"Mesurer une résistance sur carte","c":"Diagnostic électronique","o":8,"v":"Intermédiaire","a":"atelier","i":"Sur carte, une mesure est influencée par les composants autour, donc la valeur peut être faussée. On compare surtout avec une carte saine.","r":["Comparer avec une carte saine du même modèle","Mesurer une ligne vers la masse pour avoir une valeur de référence","Valeur proche de 0 Ω = court-circuit probable","Valeur infinie = ligne ouverte"],"e":["Débrancher la batterie","Choisir le mode ohms","Pointe noire à la masse, rouge sur la ligne","Com function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rngOf(seed){ let a=seed|0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const PAL=[["#38bdf8","#0b2a4a"],["#fb923c","#431c07"],["#c084fc","#2e1065"],["#4ade80","#052e16"],["#f87171","#450a0a"],["#facc15","#422006"],["#2dd4bf","#042f2e"],["#f472b6","#500724"],["#818cf8","#1e1b4b"]];

/* ---- Illustration de carte électronique (générée, unique pour chaque leçon) ---- */
function pcbArt(seed, ci, w=320, h=180){
 const R=rngOf(hashStr(String(seed))), P=PAL[Math.abs(ci||0)%PAL.length], a=P[0], bg=P[1];
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${hashStr(seed+"x")}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#050a18"/></linearGradient><radialGradient id="r${hashStr(seed+"y")}"><stop offset="0" stop-color="${a}" stop-opacity=".55"/><stop offset="1" stop-color="${a}" stop-opacity="0"/></radialGradient></defs><rect width="${w}" height="${h}" fill="url(#g${hashStr(seed+"x")})"/>`;
 for(let x=0;x<w;x+=16) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${a}" stroke-opacity=".05"/>`;
 for(let y=0;y<h;y+=16) s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${a}" stroke-opacity=".05"/>`;
 const pts=[];
 for(let i=0;i<16;i++){
  let x=Math.round(R()*w/16)*16, y=Math.round(R()*h/16)*16, d=`M${x} ${y}`; pts.push([x,y]);
  const n=2+Math.floor(R()*3);
  for(let k=0;k<n;k++){ const horiz=R()<.5, len=(1+Math.floor(R()*4))*16*(R()<.5?-1:1);
   if(horiz){ x+=len; d+=`H${x}`; } else { y+=len; d+=`V${y}`; }
   if(R()<.45){ const dg=16*(R()<.5?-1:1); x+=dg; y+=dg; d+=`L${x} ${y}`; } }
  s+=`<path d="${d}" fill="none" stroke="${a}" stroke-opacity="${(.35+R()*.4).toFixed(2)}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x}" cy="${y}" r="3.2" fill="${a}" fill-opacity=".8"/>`;
 }
 const chips=2+Math.floor(R()*2);
 for(let i=0;i<chips;i++){
  const cw=48+Math.floor(R()*4)*10, ch=36+Math.floor(R()*3)*10, cx=Math.round((16+R()*(w-cw-32))/8)*8, cy=Math.round((12+R()*(h-ch-24))/8)*8;
  s+=`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="3" fill="#0a1020" stroke="${a}" stroke-width="1.5"/>`;
  for(let p=6;p<cw-4;p+=8) s+=`<rect x="${cx+p}" y="${cy-4}" width="3" height="4" fill="${a}" fill-opacity=".8"/><rect x="${cx+p}" y="${cy+ch}" width="3" height="4" fill="${a}" fill-opacity=".8"/>`;
  for(let p=6;p<ch-4;p+=8) s+=`<rect x="${cx-4}" y="${cy+p}" width="4" height="3" fill="${a}" fill-opacity=".8"/><rect x="${cx+cw}" y="${cy+p}" width="4" height="3" fill="${a}" fill-opacity=".8"/>`;
  s+=`<circle cx="${cx+8}" cy="${cy+8}" r="2.5" fill="${a}"/><text x="${cx+cw/2}" y="${cy+ch/2+4}" fill="${a}" fill-opacity=".7" font-size="10" text-anchor="middle" font-family="monospace">U${i+1}</text>`;
 }
 for(let i=0;i<14;i++){ const x=Math.round(R()*(w-20)/4)*4+4, y=Math.round(R()*(h-12)/4)*4+4, v=R()<.5;
  s+=`<rect x="${x}" y="${y}" width="${v?5:10}" height="${v?10:5}" rx="1" fill="#e2e8f0" fill-opacity=".75"/>`; }
 const hp=pts[Math.floor(R()*pts.length)]||[w/2,h/2];
 s+=`<circle cx="${hp[0]}" cy="${hp[1]}" r="${Math.round(h*.38)}" fill="url(#r${hashStr(seed+"y")})"/></svg>`;
 return s;
}
/* ---- Schéma légendé d'une leçon ---- */
function schemaSVG(L, ci){
 const w=360, h=230, R=rngOf(hashStr(L.id+"sch")), a=PAL[Math.abs(ci)%PAL.length][0];
 let s=pcbArt(L.id+"S",ci,w,h).replace("</svg>","");
 const steps=(L.etapes||[]).slice(0,4);
 steps.forEach((e,i)=>{
  const px=50+Math.round(R()*(w-100)), py=40+Math.round(R()*(h-90)), lx=i%2?w-24:24, ly=26+i*((h-52)/3);
  s+=`<line x1="${px}" y1="${py}" x2="${lx}" y2="${ly}" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="${px}" cy="${py}" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="${lx}" cy="${ly}" r="12" fill="${a}"/><text x="${lx}" y="${ly+5}" font-size="14" font-weight="800" fill="#06101f" text-anchor="middle" font-family="sans-serif">${i+1}</text>`;
 });
 return s+"</svg>";
}

/* ---- Liste des leçons ---- */
function vLessonsList(parts){
 const cs=cats(), ci=parts[0]==="liste"?parseInt(parts[1],10):-1, c=ci>=0?cs[ci]:null;

 let items=c?c.items:allLessons(); const n=items.length;
 if(tab!=="Toutes") items=items.filter(l=>l.v===tab);
 const tabs=["Toutes",...NIV.filter(v=>allLessons().some(l=>l.v===v))];

/* ---- Une leçon (3 écrans : Leçon / Schéma / À faire et à éviter) ---- */
function vLesson(parts){
 const L=lessonById(parts[1]); if(!L) return vLessonsList(["lecons"]);
 const tab=parts[2]||"lecon", ci=catIdx(L.c);
 if(!canOpenL(L)) return topbar(esc(L.t))+`<div class="box" style="text-align:center"><div style="font-size:48px">🔒</div><p>${sub()?U("Cette leçon est réservée à l'abonnement "+(L.a==="atelier"?"Atelier":"Pro")+".","This lesson needs the "+(L.a==="atelier"?"Workshop":"Pro")+" subscription."):(hadSub()?tr("expired"):tr("locked"))}</p><a class="btn b-org" href="#/abonnement">${sub()?U("Voir les abonnements","See plans"):tr("goPro")}</a></div>`;
 if(tab==="lecon") pushHist("hl",{id:L.id,t:Date.now()});
 const saved=S.get("dl",[]).includes(L.id);
 const tabs=`<div class="seg">${[["lecon",U("Leçon","Lesson")],["schema",U("Schéma","Diagram")],["faire",U("À faire / À éviter","Do / Avoid")]].map(([k,n])=>`<a class="${k===tab?"on":""}" href="#/lecon/${L.id}/${k}">${n}</a>`).join("")}</div>`;
 const head=`<div class="tb"><a class="ib" href="javascript:goBack()">←</a><h1>L${pad2(L.n)} – ${esc(L.t)}</h1><span class="tbr"></span></div>`;
 let body, next, nextLabel;
 if(tab==="lecon"){
  const ms=mats(L);
  body=`<div class="hero">${art(L)}<div class="sh">${esc(L.t)}</div><a class="ib dl" href="javascript:toggleSave('${L.id}')" aria-label="Enregistrer">${saved?"✅":"⤓"}</a></div>${tabs}
  <div class="box"><h4>✔ ${U("Objectif","Goal")}</h4><p>${esc(L.i?L.i.split(". ")[0].replace(/\.$/,"")+".":U("Comprendre la technique et l'appliquer en sécurité.","Understand the technique and apply it safely."))}</p></div>
  ${L.i&&L.i.includes(". ")?`<div class="box"><p>${esc(L.i)}</p></div>`:""}
  ${L.r.length?`<div class="box"><h4>${U("À retenir","Key points")}</h4><ul>${L.r.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  ${ms.length?`<div class="box"><h4>▸ ${U("Matériel nécessaire","Materials needed")}</h4><div class="mat">${ms.map(m=>`<span><i>${m[1]}</i>${m[2]}</span>`).join("")}</div></div>`:""}
  ${L.legacy?`<div class="box"><h4>${U("Étapes","Steps")}</h4>${L.e.map((x,i)=>`<div class="st"><b>${i+1}</b><span>${esc(x)}</span></div>`).join("")}</div>`:""}`;
  next=`#/lecon/${L.id}/schema`; nextLabel=U("Suivant","Next");
 } else if(tab==="schema"){
  const sv=L.legacy&&SVG[L.svg]?`<div class="sch" style="padding:8px">${SVG[L.svg]}</div>`:`<div class="sch">${L.img?`<img src="${L.img}" style="width:100%;display:block" alt="">`:schemaSVG(L,ci)}</div>`;
  body=`${tabs}${sv}${L.s?`<p class="mut" style="margin:0 16px 6px;font-size:12.5px">${esc(L.s)}</p>`:""}<div class="box"><h4>— ${U("Étapes principales","Main steps")}</h4>${L.e.map((x,i)=>`<div class="st"><b>${i+1}</b><span>${esc(x)}</span></div>`).join("")}</div>`;
  next=`#/lecon/${L.id}/faire`; nextLabel=U("Suivant","Next");
 } else {
  const good=L.r.length?L.r.slice(0,4):L.e.slice(0,3), bad=L.x;
  body=`${tabs}<div class="good"><h4>✔ ${U("Ce qu'il faut faire","What to do")}</h4><ul>${good.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="bad"><h4>✖ ${U("Ce qu'il ne faut pas faire","What not to do")}</h4><ul>${(bad.length?bad:[U("Travailler sans protection ni méthode.","Working without protection or method.")]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  next=`javascript:finishLesson('${L.id}')`; nextLabel=L.q.length?U("Terminer et passer au quiz","Finish and take the quiz"):U("Terminer la leçon ✓","Finish lesson ✓");
 }
 return head+body+`<div class="stk"><a class="btn b-acc" href="${next}">${nextLabel} ›</a></div>`;
}
function finishLesson(id){ markDone(id); const L=lessonById(id); if(L&&L.q.length) location.hash="#/quiz/run/"+id; else { toast(U("Leçon terminée ✅","Lesson completed ✅")); location.hash="#/lecons"; } }
function toggleSave(id){ let d=S.get("dl",[]); d=d.includes(id)?d.filter(x=>x!==id):[id,...d]; S.set("dl",d); toast(d.includes(id)?U("Leçon enregistrée","Lesson saved"):U("Retirée des enregistrements","Removed")); render(); }

/* ---- Quiz ---- */
let QZ=null;
function quizSets(){ return cats().map(c=>({c,n:c.items.filter(l=>l.q.length).length})).filter(x=>x.n>0); }
function vQuizList(){
 return topbar("Quiz",{back:false})+`<p class="mut" style="margin:12px 16px">${U("Teste tes connaissances par catégorie.","Test your knowledge by category.")}</p>`
  +quizSets().map(({c,n})=>`<a class="li" href="#/quiz/run/c${c.i}"><div class="th">${pcbArt("cat-"+c.name,c.i)}</div><div class="tx"><b>${esc(c.name)}</b><small>${n} ${U("questions","questions")}</small></div><div class="play">▶</div></a>`).join("");
}
function startQuiz(id){
 let ls; if(id[0]==="c"&&/^c\d+$/.test(id)){ ls=cats()[+id.slice(1)].items; } else { const l=lessonById(id); ls=l?[l]:[]; }
 const items=[]; ls.forEach(l=>l.q.forEach(q=>items.push({q:q.question,ch:q.choix,rep:q.reponse,lid:l.id,t:l.t})));
 QZ={id,items,i:0,sel:-1,score:0,title:id[0]==="c"&&/^c\d+$/.test(id)?cats()[+id.slice(1)].name:(lessonById(id)||{}).t};
}
function vQuizRun(parts){
 if(!QZ||QZ.id!==parts[2]) startQuiz(parts[2]);
 const q=QZ.items[QZ.i];
 if(!q) return topbar("Quiz")+`<div class="box" style="text-align:center"><p>${U("Pas de question pour cette leçon.","No question for this lesson.")}</p><a class="btn b-acc" href="#/quiz">OK</a></div>`;
 if(QZ.done){ const p=Math.round(100*QZ.score/QZ.items.length); return topbar("Quiz – "+esc(QZ.title||""))+`<div class="ring" style="background:conic-gradient(var(--acc) ${p}%,var(--card2) 0)"><div style="position:absolute;inset:10px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center"><b>${p}%</b><small>${QZ.score}/${QZ.items.length}</small></div></div><p style="text-align:center;margin:0 16px 12px">${p>=70?U("Bravo ! 🎉","Well done! 🎉"):U("Continue de t'entraîner 💪","Keep practising 💪")}</p><div class="pg"><a class="btn b-acc" href="#/quiz">${U("Autres quiz","More quizzes")}</a><a class="btn b-ghost" href="#/progres">${U("Voir ma progression","My progress")}</a></div>`; }
 const opts=q.ch.map((c,i)=>{ let cl=""; if(QZ.sel>-1){ if(i===q.rep) cl="ok"; else if(i===QZ.sel) cl="ko"; } return `<button class="qopt ${cl}" onclick="answerQ(${i})"><i></i>${esc(c)}</button>`; }).join("");
 return topbar("Quiz – "+esc(QZ.title||""))+`<div class="pg"><p class="mut" style="margin-top:14px">Question ${QZ.i+1}/${QZ.items.length}</p><h3 style="font-size:18px;margin:6px 0 12px">${esc(q.q)}</h3>${opts}
 ${QZ.sel>-1?`<a class="btn b-acc" href="javascript:nextQ()">${QZ.i+1<QZ.items.length?U("Suivant","Next")+" ›":U("Voir le résultat","See result")}</a>`:""}</div>`;
}
function answerQ(i){ if(QZ.sel>-1) return; QZ.sel=i; if(i===QZ.items[QZ.i].rep) QZ.score++; render(); }
function nextQ(){ if(QZ.i+1<QZ.items.length){ QZ.i++; QZ.sel=-1; } else { QZ.done=true; const qs=S.get("qs",{}); qs[QZ.id]={s:QZ.score,t:QZ.items.length,at:Date.now()}; S.set("qs",qs); } render(); }

let PAYM="orange";
function vPay(parts){
 const plan=parts[1]; if(!PLANS[plan]) return vSub();

 const MET={orange:["Orange Money","#f97316","OM"],wave:["Wave","#0ea5e9","W"],moov:["Moov Money","#2563eb","MM"]};

  if(!document.getElementById("consent").checked){toast(pick(CONSENT_ERR));return;}

  if(ref.length<4){toast(tr("needRef"));return;}
  if(!user()){ go("abonnement"); return; }

  catch(e){ b.disabled=false; toast(tr("reqErr")); } }; },0);

}

 const body=()=>document.getElementById("admBody"); if(!body()) return;

 try{
  const [reqs,users]=await Promise.all([RA.pending(),RA.allUsers()]); ADM.reqs=reqs; ADM.users=users;
  const now=Date.now(), act=users.filter(u=>u.plan&&u.until>now).length;
  const st=document.getElementById("admStats"); if(st) st.innerHTML=`<div class="kpi"><b>${act}</b><small>Abonnés actifs</small></div><div class="kpi"><b>${reqs.length}</b><small>En attente</small></div><div class="kpi"><b>${users.length}</b><small>Comptes</small></div>`;
  if(!body()) return;
  if(tab==="demandes"){
   body().innerHTML=`<div class="sec"><h3>Demandes en attente</h3></div>`+(reqs.length?reqs.map(r=>`<div class="li" style="display:block"><b>${AT[r.plan]||r.plan}</b> · ${Number(r.amount).toLocaleString("fr-FR")} FCFA <span class="pillb o">en attente</span>${r.method?`<span class="pillb">${esc(r.method)}</span>`:""}
    <small style="display:block;color:var(--mut);margin-top:3px">${esc(r.email||r.phone||r.uid)}<br>Réf : ${esc(r.reference||"")} · Payé par : ${esc(r.payerPhone||"—")}<br>${r.createdAt?when(r.createdAt):""}</small>
    <div class="mini"><button class="g" onclick="admApprove('${r.id}')">Valider et activer</button><button class="r" onclick="admReject('${r.id}')">Refuser</button></div></div>`).join(""):`<p class="mut" style="margin:0 16px">Aucune demande en attente.</p>`);
  } else if(tab==="abonnes"){
   const f=ADM.f, q=ADM.q.toLowerCase();
   let list=users.filter(u=>f==="actifs"?(u.plan&&u.until>now):f==="expires"?(u.plan&&u.until<=now):true);
   if(q) list=list.filter(u=>((u.email||"")+(u.phone||"")+(u.name||"")).toLowerCase().includes(q));
   body().innerHTML=`<div class="seg">${[["actifs","En cours"],["expires","Expirés"],["tous","Tous"]].map(([k,n])=>`<button class="${f===k?"on":""}" onclick="ADM.f='${k}';admLoad('abonnes')">${n}</button>`).join("")}</div>
    <div style="padding:0 16px"><input placeholder="Chercher (email, nom, numéro)" value="${esc(ADM.q)}" onchange="ADM.q=this.value;admLoad('abonnes')"></div>
    <div class="sec"><h3>${list.length} client${list.length>1?"s":""}</h3></div>`+(list.map(userCard).join("")||`<p class="mut" style="margin:0 16px">Aucun client.</p>`);
  } else if(tab==="lecons"){
   ADM.lessons=await RA.allLessons();
   body().innerHTML=`<div class="sec"><h3>Leçons ajoutées (${ADM.lessons.length})</h3><a href="#/admin/ajouter" onclick="ADM.edit=null">+ Ajouter</a></div>`+(ADM.lessons.length?ADM.lessons.map(l=>`<div class="li" style="display:block"><div style="display:flex;gap:10px;align-items:center"><div class="th">${l.image?`<img src="${l.image}" alt="">`:pcbArt("fs"+l.id,catIdx(l.categorie))}</div><div style="flex:1"><b>${esc(l.titre)}</b> <span class="pillb ${l.statut==="publie"?"g":"o"}">${l.statut==="publie"?"publiée":"brouillon"}</span><small style="display:block;color:var(--mut)">${esc(l.categorie)} · ${esc(l.niveau)} · ${esc(l.acces)}</small></div></div>
    <div class="mini"><button onclick="admEdit('${l.id}')">Modifier</button><button class="g" onclick="admPub('${l.id}','${l.statut==="publie"?"brouillon":"publie"}')">${l.statut==="publie"?"Dépublier":"Publier"}</button><button class="r" onclick="admDel('${l.id}')">Supprimer</button></div></div>`).join(""):`<p class="mut" style="margin:0 16px">Aucune leçon ajoutée pour le moment. Les 60 leçons de base sont déjà dans le site.</p>`);
  } else { body().innerHTML=admForm(ADM.edit?ADM.lessons.find(x=>x.id===ADM.edit)||{}:{}); }
 }catch(e){ if(body()) body().innerHTML=admErr(e); }
}

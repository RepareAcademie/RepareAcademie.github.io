function admParse(txt){
 txt=(txt||"").trim(); if(!txt) return null;
 if(txt[0]==="{"){ try{ return JSON.parse(txt); }catch(e){} }
 const norm=x=>x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
 const keyOf=h=>{ const n=norm(h); if(n==="titre")return"titre"; if(n.startsWith("categ"))return"categorie"; if(n==="niveau")return"niveau"; if(n==="acces")return"acces"; if(n.startsWith("duree"))return"duree_minutes"; if(n.startsWith("intro"))return"introduction"; if(n==="aretenir"||n==="pointscles")return"a_retenir"; if(n==="etapes"||n==="etape")return"etapes"; if(n.startsWith("erreur")||n==="aeviter")return"erreurs_frequentes"; if(n==="quiz"||n==="question")return"quiz"; if(n==="reponses"||n==="reponse")return"choix"; return null; };
 const buf={}; let cur=null;
 txt.split(/\r?\n/).forEach(line=>{ const m=line.match(/^\s*([A-Za-zÀ-ÿ' ]{3,25})\s*:\s*(.*)$/); const k=m&&keyOf(m[1]); if(k){ cur=k; buf[k]=buf[k]||[]; if(m[2].trim()) buf[k].push(m[2].trim()); } else if(cur&&line.trim()) buf[cur].push(line.trim()); });
 const clean=x=>x.replace(/^([-•*·]|\d+\s*[.)])\s*/,"").trim(), d={};
 ["titre","categorie","niveau","acces"].forEach(k=>{ if(buf[k]) d[k]=buf[k].join(" ").trim(); });
 if(buf.duree_minutes) d.duree_minutes=parseInt(buf.duree_minutes.join(" "),10)||10;
 if(buf.introduction) d.introduction=buf.introduction.join(" ");
 ["a_retenir","etapes","erreurs_frequentes"].forEach(k=>{ if(buf[k]) d[k]=buf[k].map(clean).filter(Boolean); });
 const ql=(buf.quiz||[]).concat(buf.choix||[]);
 if(ql.length){ const ch=[]; let rep=0; ql.slice(1).forEach(l=>{ const ok=/^\s*\*|\(bonne\)|✓|✅/i.test(l); const t=clean(l).replace(/\(bonne\)|✓|✅/gi,"").trim(); if(t){ if(ok) rep=ch.length; ch.push(t); } }); d.quiz=[{question:clean(ql[0]),choix:ch.slice(0,3),reponse:Math.min(rep,2)}]; }
 return d;
}
function admFillPaste(silent){
 const box=document.getElementById("fPaste"); if(!box||!box.value.trim()) return false;
 const d=admParse(box.value); if(!d||!d.titre){ toast("Je ne trouve pas le titre : la leçon doit commencer par « TITRE : … »."); return false; }
 const set=(id,v)=>{ const e=document.getElementById(id); if(e&&v!=null&&v!=="") e.value=v; };
 const pickOpt=(id,v)=>{ const e=document.getElementById(id); if(!e||!v) return; const n=x=>x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); const o=[...e.options].find(o=>n(o.value)===n(v)||n(o.value).startsWith(n(v).slice(0,5))); if(o) e.value=o.value; };
 set("fT",d.titre); set("fC",d.categorie); pickOpt("fN",d.niveau); pickOpt("fA",d.acces); set("fD",d.duree_minutes); set("fI",d.introduction);
 set("fR",(d.a_retenir||[]).join("\n")); set("fE",(d.etapes||[]).join("\n")); set("fX",(d.erreurs_frequentes||[]).join("\n"));
 const q=d.quiz&&d.quiz[0]; if(q){ set("fQ",q.question); (q.choix||[]).forEach((c,i)=>set("fQ"+(i+1),c)); const r=document.querySelector('input[name=fQr][value="'+(q.reponse||0)+'"]'); if(r) r.checked=true; }
 if(!silent){ const dt=document.querySelector("#admBody details"); if(dt) dt.open=true; toast("Cases remplies ✅ Vérifie puis touche Publier."); }
 return true;
}
function readImg(file,max=800){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); let q=.78,u=c.toDataURL("image/jpeg",q); while(u.length>600000&&q>.3){ q-=.1; u=c.toDataURL("image/jpeg",q); } res(u); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
async function admSave(publish){
 admFillPaste(true);
 const g=id=>document.getElementById(id).value.trim(), lines=id=>g(id).split("\n").map(x=>x.trim()).filter(Boolean);
 const d={titre:g("fT"),categorie:g("fC"),niveau:g("fN"),acces:g("fA"),duree_minutes:+g("fD")||10,introduction:g("fI"),a_retenir:lines("fR"),etapes:lines("fE"),erreurs_frequentes:lines("fX"),statut:publish?"publie":"brouillon"};

(function(){
"use strict";
const M=window.MQ;
const LEGACY={tools:"outils",open:"ouvrir",charge:"charge",battery:"batterie",screen:"ecran",keypad:"touches",camera:"camera",solder:"soudure",board:"cartemere"};
const RULES=[[/court-circuit|court circuit/,"microsoudure-50"],[/oxyd|tomb[ée] dans l.eau|mouill/,"microsoudure-60"],[/multim[eè]tre/,"microsoudure-45"],[/charg|usb|type-c/,"charge"],[/batter/,"batterie"],[/[ée]cran|lcd|oled|affich|tactile/,"ecran"],[/cam[ée]ra|photo|objectif/,"camera"],[/touche|clavier/,"touches"],[/micro\b|microphone|audio|haut-parleur|[ée]couteur|\bson\b/,"microsoudure-56"],[/alimentation|pmic/,"microsoudure-57"],[/soud|[ée]tain|flux/,"soudure"],[/ouvr|d[ée]mont|vitre arri/,"ouvrir"],[/outil/,"outils"]];
function sceneFor(L){
  if(!L) return "cartemere";
  if(M.scenes[L.id]) return L.id;
  if(L.svg && LEGACY[L.svg]) return LEGACY[L.svg];
  const t=((L.t||"")+" "+(L.c||"")+" "+(L.i||"")).toLowerCase();
  for(const [re,id] of RULES) if(re.test(t)) return id;
  return "cartemere";
}
M.sceneFor=sceneFor;
function boot(){
  M.inject();
  try{ if(typeof SVG==="object" && SVG){ Object.keys(LEGACY).forEach(k=>{ SVG[k]=M.html(LEGACY[k]); }); } }catch(e){}
  window.schemaSVG=function(L){ return M.html(sceneFor(L)); };
  try{ if(/\/schema/.test(location.hash) && typeof render==="function") render(); }catch(e){}
}
if(document.body) boot(); else document.addEventListener("DOMContentLoaded",boot);
})();
